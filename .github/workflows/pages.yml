name: Deploy to GitHub Pages

# Publishes the self-contained MASTER calculator as the site landing page,
# alongside the modular vehicle app, the housing app, and their assets.
#
# ONE-TIME SETUP: repo Settings → Pages → Build and deployment →
#   Source: "GitHub Actions". Then merge to main (or run this workflow
#   manually via the Actions tab → "Deploy to GitHub Pages" → Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          set -eux
          mkdir -p _site
          # MASTER (self-contained) is the default landing page.
          cp daddy_hackulator_MASTER_v5.html _site/index.html
          cp daddy_hackulator_MASTER_v5.html _site/master.html
          # Other variants + assets (best-effort; skip if absent).
          [ -f daddy_hackulator_ULTIMATE_v5.html ] && cp daddy_hackulator_ULTIMATE_v5.html _site/ultimate.html || true
          [ -f housing.html ] && cp housing.html _site/housing.html || true
          [ -f index.html ] && cp index.html _site/vehicle.html || true
          for d in css js data; do [ -d "$d" ] && cp -r "$d" _site/ || true; done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
