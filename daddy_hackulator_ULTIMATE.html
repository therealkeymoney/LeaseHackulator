function applyMileageAdjustment(residual, mileagePerYear) {
                                                  if (!mileagePerYear || mileagePerYear === 12000) return residual;

                                                  if (mileagePerYear <= 10000) return residual + 2;
                                                  if (mileagePerYear >= 15000) return residual - 3;

                                                  return residual;
                                                }

function applyTermAdjustment(residual, term) {
                                                  if (!term || term === 36) return residual;

                                                  var adjustments = {
                                                    24: 3,
                                                    27: 1,
                                                    30: 0,
                                                    33: 0,
                                                    36: 0,
                                                    39: -2,
                                                    42: -3,
                                                    48: -5
                                                  };

                                                  var adjustment = adjustments[term] || 0;
                                                  return residual + adjustment;
                                                }

function equityStrategyLabel(downScenario, tradeScenario) {
                                                  var downLabel = downScenario === 'capreduction' ? 'Down to Cap' :
                                                    downScenario === 'split5050' ? 'Down 50/50' :
                                                    downScenario === 'atbuyout' ? 'Down to Buyout' : 'Down Default';
                                                  var tradeLabel = tradeScenario === 'capreduction' ? 'Trade to Cap' :
                                                    tradeScenario === 'split5050' ? 'Trade 50/50' :
                                                    tradeScenario === 'atbuyout' ? 'Trade to Buyout' :
                                                    tradeScenario === 'checkback' ? 'Trade Check-Back' : 'Trade Default';
                                                  return downLabel + ' | ' + tradeLabel;
                                                }

function formatResidualResult(result) {
                                                  var confidencePercentage = (result.confidence * 100).toFixed(0);
                                                  var confidenceColor = result.confidence >= 0.85 ? 'green' :
                                                    result.confidence >= 0.70 ? 'yellow' : 'red';

                                                  return {
                                                    value: result.residual.toFixed(1),
                                                    confidence: confidencePercentage,
                                                    confidenceColor: confidenceColor,
                                                    source: result.source,
                                                    tier: result.tier
                                                  };
                                                }

function getEnhancedMoneyFactor(make, model) {
                                                  if (!SCRAPED_DATA?.manufacturers) return null;

                                                  var makeKey = make.toLowerCase();
                                                  var makeData = SCRAPED_DATA.manufacturers[makeKey];

                                                  if (!makeData?.aggregated?.mfAverage) return null;

                                                  return makeData.aggregated.mfAverage;
                                                }

function getEnhancedResidual(make, model, term = 36, mileage = 12000, vehicleClass = 'default') {
                                                  console.log('Residual lookup: ${make} ${model}');

                                                  var result = getResidualFromAggregated(make, model, term, mileage);
                                                  if (result) {
                                                    console.log('Tier 1: ${result.residual.toFixed(1)}%');
                                                    return result;
                                                  }

                                                  result = getResidualFromManufacturer(make, term, mileage);
                                                  if (result) {
                                                    console.log('Tier 2: ${result.residual.toFixed(1)}%');
                                                    return result;
                                                  }

                                                  result = getResidualFromFallback(vehicleClass, term, mileage);
                                                  console.log('Tier 3 (Fallback): ${result.residual.toFixed(1)}%');
                                                  return result;
                                                }

function getNum(input) {
                                              if (!input) return 0;
                                              var val = parseFloat(input.value);
                                              return isNaN(val) ? 0 : val;
                                            }

function getResidualFromAggregated(make, model, term, mileage) {
                                                  if (!SCRAPED_DATA?.manufacturers) return null;

                                                  var makeKey = make.toLowerCase();
                                                  var modelKey = model.toLowerCase();

                                                  var makeData = SCRAPED_DATA.manufacturers[makeKey];
                                                  if (!makeData?.models) return null;

                                                  var modelData = makeData.models[modelKey];
                                                  if (!modelData || modelData.confidence < 0.85) return null;

                                                  var residual = modelData.residualAverage || 0;
                                                  residual = applyTermAdjustment(residual, term);
                                                  residual = applyMileageAdjustment(residual, mileage);

                                                  return {
                                                    residual: residual,
                                                    confidence: 0.90,
                                                    source: 'aggregated',
                                                    dataPoints: modelData.count,
                                                    tier: 1
                                                  };
                                                }

function getResidualFromFallback(vehicleClass, term, mileage) {
                                                  var fallback = FALLBACK_RESIDUALS[vehicleClass] || FALLBACK_RESIDUALS['default'];

                                                  var residual = fallback;
                                                  residual = applyTermAdjustment(residual, term);
                                                  residual = applyMileageAdjustment(residual, mileage);

                                                  return {
                                                    residual: residual,
                                                    confidence: 0.50,
                                                    source: 'fallback',
                                                    dataPoints: 0,
                                                    tier: 3
                                                  };

                                                }

function getResidualFromManufacturer(make, term, mileage) {
                                                  if (!SCRAPED_DATA?.manufacturers) return null;

                                                  var makeKey = make.toLowerCase();
                                                  var makeData = SCRAPED_DATA.manufacturers[makeKey];

                                                  if (!makeData?.aggregated?.residualAverage) return null;

                                                  var residual = makeData.aggregated.residualAverage;
                                                  residual = applyTermAdjustment(residual, term);
                                                  residual = applyMileageAdjustment(residual, mileage);

                                                  return {
                                                    residual: residual,
                                                    confidence: 0.75,
                                                    source: 'manufacturer_avg',
                                                    dataPoints: 0,
                                                    tier: 2
                                                  };
                                                }

function getScrapedMfrData(make) {
                                              if (!make) return null;
                                              const makeLower = make.toLowerCase().replace(/[^a-z]/g, '');
                                              const manufacturers = window.SCRAPED_MFR_DATA?.manufacturers;

                                              for (const key in manufacturers) {
                                                if (key.replace(/[^a-z]/g, '') === makeLower) {
                                                  return manufacturers[key];
                                                }
                                              }
                                              return null;
                                            }

function getTierForDistance(distance) {
                                                    if (distance <= INCENTIVES_CONFIG.tier1.radius) {
                                                      return { ...INCENTIVES_CONFIG.tier1, distance };
                                                    }
                                                    if (distance <= INCENTIVES_CONFIG.tier2.radius) {
                                                      return { ...INCENTIVES_CONFIG.tier2, distance };
                                                    }
                                                    if (distance <= INCENTIVES_CONFIG.tier3.radius) {
                                                      return { ...INCENTIVES_CONFIG.tier3, distance };
                                                    }
                                                    return { ...INCENTIVES_CONFIG.tier4, distance };
                                                  }

function formatValue(value, format) {
    if (value === null || value === undefined) return 'N/A';
    switch(format) {
        case 'currency':
            return '$' + fmt(value);
        case 'percent':
            return value.toFixed(2) + '%';
        case 'mf':
            return value.toFixed(5);
        case 'number':
            return value.toFixed(0);
        default:
            return value.toString();
    }
}

function compareMetric(value1, value2, lowerBetter, label, format) {
    const diff = value1 - value2;
    const avgValue = (value1 + value2) / 2;
    const percentDiff = avgValue !== 0 ? Math.abs(diff / avgValue) * 100 : 0;
    
    let status, arrow, color, winner;
    
    if (percentDiff <= NEGLIGIBLE_THRESHOLD) {
        status = 'negligible';
        arrow = '○';
        color = '#f59e0b';
        winner = null;
    } else if (lowerBetter === null) {
        status = 'different';
        arrow = value1 > value2 ? '↑' : '↓';
        color = '#6b7280';
        winner = null;
    } else if (lowerBetter) {
        if (value1 < value2) {
            status = 'better'; arrow = '↓'; color = '#10b981'; winner = 1;
        } else {
            status = 'worse'; arrow = '↑'; color = '#ef4444'; winner = 2;
        }
    } else {
        if (value1 > value2) {
            status = 'better'; arrow = '↑'; color = '#10b981'; winner = 1;
        } else {
            status = 'worse'; arrow = '↓'; color = '#ef4444'; winner = 2;
        }
    }
    
    return {
        value1, value2, diff, percentDiff, status, arrow, color, winner,
        label, format,
        formatted1: formatValue(value1, format),
        formatted2: formatValue(value2, format),
        formattedDiff: formatValue(Math.abs(diff), format)
    };
}

function determineOverallWinner(metrics) {
    let score1 = 0, score2 = 0, negligible = 0;
    
    Object.values(metrics).forEach(metric => {
        if (metric.winner === 1) score1++;
        else if (metric.winner === 2) score2++;
        else if (metric.status === 'negligible') negligible++;
    });
    
    const totalMetrics = Object.keys(metrics).length;
    
    return {
        winner: score1 > score2 ? 1 : (score2 > score1 ? 2 : null),
        score1, score2, negligible, totalMetrics,
        winMargin: Math.abs(score1 - score2),
        description: score1 > score2 
            ? `Vehicle 1 wins ${score1} vs ${score2}` 
            : (score2 > score1 
                ? `Vehicle 2 wins ${score2} vs ${score1}` 
                : `Tie: ${score1} vs ${score2}`)
    };
}

function compareTwoVehicles(pair) {
    const v1 = pair.vehicle1;
    const v2 = pair.vehicle2;
    
    const v1Name = `${v1.year || ''} ${v1.make || ''} ${v1.model || ''}`.trim() || `Vehicle ${pair.index1 + 1}`;
    const v2Name = `${v2.year || ''} ${v2.make || ''} ${v2.model || ''}`.trim() || `Vehicle ${pair.index2 + 1}`;
    
    const comparison = {
        vehicle1: { index: pair.index1, name: v1Name, data: v1 },
        vehicle2: { index: pair.index2, name: v2Name, data: v2 },
        metrics: {}
    };
    
    const metrics = [
        { key: 'monthlyPayment', label: 'Monthly Payment', lowerBetter: true, format: 'currency' },
        { key: 'totalCost', label: 'Total Cost', lowerBetter: true, format: 'currency', 
          getValue: (v) => (v.results.monthlyPayment || 0) * (v.results.term || 36) },
        { key: 'downPayment', label: 'Down Payment', lowerBetter: true, format: 'currency' },
        { key: 'dueAtSigning', label: 'Due at Signing', lowerBetter: true, format: 'currency' },
        { key: 'msrp', label: 'MSRP', lowerBetter: false, format: 'currency' },
        { key: 'residualValue', label: 'Residual Value', lowerBetter: false, format: 'currency' },
        { key: 'residualPct', label: 'Residual %', lowerBetter: false, format: 'percent' },
        { key: 'moneyFactor', label: 'Money Factor', lowerBetter: true, format: 'mf' },
        { key: 'apr', label: 'APR', lowerBetter: true, format: 'percent' },
        { key: 'epaCombinedMpg', label: 'Combined MPG', lowerBetter: false, format: 'number' },
        { key: 'mpgeCombined', label: 'MPGe Combined', lowerBetter: false, format: 'number' },
        { key: 'energyCost', label: 'Annual Energy Cost', lowerBetter: true, format: 'currency' },
        { key: 'term', label: 'Term (months)', lowerBetter: null, format: 'number' },
        { key: 'annualMileage', label: 'Annual Mileage', lowerBetter: null, format: 'number' },
        { key: 'goldenRulePct', label: 'Golden Rule %', lowerBetter: true, format: 'percent',
          getValue: (v) => v.results.goldenRule ? v.results.goldenRule.percentage : null }
    ];
    
    metrics.forEach(metric => {
        const value1 = metric.getValue ? metric.getValue(v1) : (v1.results[metric.key] ?? v1[metric.key]);
        const value2 = metric.getValue ? metric.getValue(v2) : (v2.results[metric.key] ?? v2[metric.key]);
        
        if (value1 !== null && value1 !== undefined && value2 !== null && value2 !== undefined) {
            comparison.metrics[metric.key] = compareMetric(value1, value2, metric.lowerBetter, metric.label, metric.format);
        }
    });
    
    comparison.overallWinner = determineOverallWinner(comparison.metrics);
    return comparison;
}

function generateAllPairwiseComparisons() {
    const calculatedVehicles = vehicles.filter(v => v.results);
    
    if (calculatedVehicles.length < 2) {
        return { valid: false, message: 'Need at least 2 calculated vehicles for comparison' };
    }
    
    const pairs = [];
    for (let i = 0; i < calculatedVehicles.length; i++) {
        for (let j = i + 1; j < calculatedVehicles.length; j++) {
            pairs.push({
                vehicle1: calculatedVehicles[i],
                vehicle2: calculatedVehicles[j],
                index1: vehicles.indexOf(calculatedVehicles[i]),
                index2: vehicles.indexOf(calculatedVehicles[j])
            });
        }
    }
    
    const comparisons = pairs.map(pair => compareTwoVehicles(pair));
    
    return {
        valid: true,
        totalVehicles: calculatedVehicles.length,
        totalComparisons: pairs.length,
        comparisons: comparisons
    };
}

function renderPairwiseComparison(comparison, index) {
    const v1 = comparison.vehicle1;
    const v2 = comparison.vehicle2;
    const winner = comparison.overallWinner;
    
    return `
        <div class="pairwise-card ${winner.winner ? 'has-winner' : 'tie'}">
            <div class="comparison-title">
                <h3>
                    <span class="vehicle-badge ${winner.winner === 1 ? 'winner' : ''}">Vehicle ${v1.index + 1}</span>
                    <span class="vs-separator">VS</span>
                    <span class="vehicle-badge ${winner.winner === 2 ? 'winner' : ''}">Vehicle ${v2.index + 1}</span>
                </h3>
                <div class="vehicle-names">
                    <span class="vehicle-name">${v1.name}</span>
                    <span class="vehicle-name">${v2.name}</span>
                </div>
            </div>
            <div class="overall-winner">
                ${winner.winner 
                    ? '<span class="winner-badge">🏆 Vehicle ' + winner.winner + ' Wins (' + winner.score1 + ' - ' + winner.score2 + ')</span>'
                    : '<span class="tie-badge">🤝 Tie (' + winner.score1 + ' - ' + winner.score2 + ')</span>'
                }
                <span class="negligible-count">${winner.negligible} negligible difference${winner.negligible !== 1 ? 's' : ''}</span>
            </div>
            <div class="metrics-comparison">
                ${Object.entries(comparison.metrics).map(([key, metric]) => `
                    <div class="metric-row ${metric.status}">
                        <div class="metric-label">${metric.label}</div>
                        <div class="metric-values">
                            <span class="value ${metric.winner === 1 ? 'winning' : ''}">${metric.formatted1}</span>
                            <span class="comparison-arrow" style="color: ${metric.color};">${metric.arrow}</span>
                            <span class="value ${metric.winner === 2 ? 'winning' : ''}">${metric.formatted2}</span>
                        </div>
                        <div class="metric-diff">Δ ${metric.formattedDiff} (${metric.percentDiff.toFixed(1)}%)</div>
                    </div>
                `).join('')}
            </div>
            <div class="comparison-actions">
                <button class="btn-sm btn-secondary" onclick="exportPairwiseComparison(${v1.index}, ${v2.index})">📊 Export Comparison</button>
            </div>
        </div>
    `;
}

function renderAllPairwiseComparisons(container) {
    if (!container) return;
    
    const result = generateAllPairwiseComparisons();
    
    if (!result.valid) {
        container.innerHTML = '<div class="pairwise-unavailable"><p>' + result.message + '</p></div>';
        return;
    }
    
    container.innerHTML = `
        <div class="pairwise-comparisons-container">
            <div class="pairwise-header">

                    <span class="stat-badge"><strong>${result.totalComparisons}</strong> Comparisons</span>

            <div class="comparison-legend">

            </div>

    `;
}

function exportPairwiseComparison(index1, index2) {
    const v1 = vehicles[index1];
    const v2 = vehicles[index2];
    
    if (!v1 || !v2) { showToast('Vehicles not found', true); return; }
    
    const pair = { vehicle1: v1, vehicle2: v2, index1: index1, index2: index2 };
    const comparison = compareTwoVehicles(pair);
    
    const exportData = {
        comparison: comparison,
        exportedAt: new Date().toISOString(),
        applicationVersion: "daddy's Hackulator v2.0"
    };
    
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pairwise_comparison_${index1 + 1}_vs_${index2 + 1}_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    
    showToast('Comparison exported!');
}

function getNextMarketCheckKey() {
    const config = MARKETCHECK_API_CONFIG;
    if (config.getNextApiKey) return config.getNextApiKey();
    const key = config.keys[config.currentKeyIndex || 0];
    config.currentKeyIndex = ((config.currentKeyIndex || 0) + 1) % config.keys.length;
    return key;
}

async function getZipCoordinates(zip) {
    try {
        const response = await fetch(`https://api.zippopotam.us/us/${zip}`);
        if (!response.ok) throw new Error('ZIP code not found');
        const data = await response.json();
        if (data.places && data.places.length > 0) {
            const place = data.places[0];
            return {
                lat: parseFloat(place.latitude),
                lon: parseFloat(place.longitude),
                city: place['place name'],
                state: place['state abbreviation']
            };
        }
        throw new Error('No location data found');
    } catch (error) {
        console.error('Error getting ZIP coordinates:', error);
        return null;
    }
}

async function searchIncentivesByRadius(lat, lon, radius, year, make, model) {
    const apiKey = getNextMarketCheckKey();
    try {
        const baseUrl = (MARKETCHECK_API_CONFIG.baseUrl || 'https://mc-api.marketcheck.com/v2');
        const url = new URL(`${baseUrl}/incentives/search`);
        url.searchParams.append('api_key', apiKey);
        url.searchParams.append('latitude', lat);
        url.searchParams.append('longitude', lon);
        url.searchParams.append('radius', radius);
        url.searchParams.append('year', year);
        url.searchParams.append('make', make);
        url.searchParams.append('model', model);
        url.searchParams.append('status', 'active');

        const response = await fetch(url.toString());
        if (response.status === 429) {
            console.warn('Rate limit hit, rotating API key');
            return searchIncentivesByRadius(lat, lon, radius, year, make, model);
        }
        if (!response.ok) throw new Error(`API error: ${response.status}`);

        const data = await response.json();
        if (data.incentives && Array.isArray(data.incentives)) {
            return data.incentives.map(incentive => ({
                id: incentive.id,
                name: incentive.name,
                description: incentive.description,
                type: incentive.type,
                amount: incentive.amount,
                amountType: incentive.amount_type,
                terms: incentive.terms,
                expirationDate: incentive.expiration_date,
                manufacturer: incentive.manufacturer,
                dealer: incentive.dealer,
                region: incentive.region,
                distance: incentive.latitude && incentive.longitude ?
                    calculateIncentiveDistance(lat, lon, incentive.latitude, incentive.longitude) : null,
                radius: radius
            }));
        }
        return [];
    } catch (error) {
        console.error(`Error searching radius ${radius}:`, error);
        throw error;
    }
}

async function fetchIncentivesFromMarketCheck(zip, year, make, model, onProgress = null) {
    if (!zip || zip.length !== 5) throw new Error('Invalid ZIP code');
    const results = {};
    let foundIncentives = false;

    try {
        const coordinates = await getZipCoordinates(zip);
        if (!coordinates) throw new Error('Could not find coordinates for ZIP code');

        for (const radius of INCENTIVE_SEARCH_RADII) {
            if (onProgress) onProgress(`Searching ${radius} mile radius...`);
            try {
                const incentives = await searchIncentivesByRadius(
                    coordinates.lat, coordinates.lon, radius, year, make, model
                );
                results[radius] = incentives;
                if (incentives && incentives.length > 0) {
                    foundIncentives = true;
                    if (onProgress) onProgress(`Found ${incentives.length} incentives in ${radius} mile radius`);
                    break;
                }
            } catch (error) {
                console.warn(`Error searching ${radius} mile radius:`, error);
                results[radius] = { error: error.message, incentives: [] };
            }
        }
        if (!foundIncentives && onProgress) onProgress('No incentives found in any radius');
        return results;
    } catch (error) {
        console.error('Error fetching incentives:', error);
        throw error;
    }
}

function parseIncentiveResults(results) {
    const organized = {
        rebates: [], bonuses: [], leaseDeals: [], financingDeals: [],
        tradeInBonuses: [], other: [], allIncentives: []
    };

    for (const radius of INCENTIVE_SEARCH_RADII) {
        if (results[radius] && results[radius].length > 0) {
            results[radius].forEach(incentive => {
                organized.allIncentives.push(incentive);
                switch (incentive.type?.toLowerCase()) {
                    case 'rebate': organized.rebates.push(incentive); break;
                    case 'bonus': case 'manufacturer_bonus': organized.bonuses.push(incentive); break;
                    case 'lease': case 'lease_deal': organized.leaseDeals.push(incentive); break;
                    case 'finance': case 'financing_deal': organized.financingDeals.push(incentive); break;
                    case 'trade': case 'trade_in_bonus': organized.tradeInBonuses.push(incentive); break;
                    default: organized.other.push(incentive);
                }
            });
            break;
        }
    }
    return organized;
}

function buildIncentivesSummary(parsed) {
    const summary = { totalIncentives: parsed.allIncentives.length, totalAmount: 0, html: '', data: parsed };

    if (parsed.allIncentives.length === 0) {
        summary.html = '<p style="color: #666;">No incentives found</p>';
        return summary;
    }

    parsed.allIncentives.forEach(inc => {
        if (inc.amountType === 'fixed' && inc.amount) summary.totalAmount += inc.amount;
    });

    let html = '<div class="incentives-summary" style="margin-top: 15px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 8px;">';
    html += `<h4 style="margin: 0 0 10px 0;">Available Incentives (${parsed.allIncentives.length} found)</h4>`;
    if (summary.totalAmount > 0) {
        html += `<p style="margin: 5px 0;"><strong>Total Value: $${summary.totalAmount.toLocaleString()}</strong></p>`;
    }

    const categories = [
        { key: 'rebates', label: '💰 Rebates' },
        { key: 'bonuses', label: '🎁 Bonuses' },
        { key: 'leaseDeals', label: '📋 Lease Deals' },
        { key: 'financingDeals', label: '💳 Financing Deals' },
        { key: 'tradeInBonuses', label: '🔄 Trade-In Bonuses' },
        { key: 'other', label: '📌 Other' }
    ];

    categories.forEach(cat => {
        if (parsed[cat.key] && parsed[cat.key].length > 0) {
            html += `<div style="margin: 10px 0;"><h5 style="margin: 5px 0;">${cat.label} (${parsed[cat.key].length})</h5><ul style="margin: 5px 0; padding-left: 20px;">`;
            parsed[cat.key].forEach(inc => {
                html += `<li style="margin: 3px 0;"><strong>${inc.name}</strong>`;
                if (inc.amount) html += ` - $${inc.amount.toLocaleString()}`;
                if (inc.expirationDate) html += `<br><small>Expires: ${new Date(inc.expirationDate).toLocaleDateString()}</small>`;
                html += '</li>';
            });
            html += '</ul></div>';
        }
    });

    html += '</div>';
    summary.html = html;
    return summary;
}

function buildLeaseWithBalloonRestructure(leaseData, balloonData, restructureData) {
  var phase1Schedule = generateLeaseSchedule(
    leaseData.capCost,
    leaseData.residual,
    leaseData.months,
    leaseData.moneyFactor,
    leaseData.monthlyTax
  );
  var balloonPrincipal = balloonData.balloonAmount - (restructureData.newDownPayment || 0);
  var phase2Schedule = generateAmortizationSchedule(
    Math.max(0, balloonPrincipal),
    restructureData.newTermMonths,
    restructureData.newApr,
    0
  );
  var phase1Total = phase1Schedule.reduce(function(sum, row) { return sum + row.payment; }, 0);
  var phase2Total = phase2Schedule.reduce(function(sum, row) { return sum + row.payment; }, 0);
  var totalMonths = leaseData.months + restructureData.newTermMonths;
  var totalMiles = leaseData.annualMiles * (totalMonths / 12);
  return {
    phase1Schedule: phase1Schedule,
    phase2Schedule: phase2Schedule,
    phase1Months: leaseData.months,
    phase2Months: restructureData.newTermMonths,
    totalMonths: totalMonths,
    metrics: {
      phase1TotalPayments: phase1Total,
      phase2TotalPayments: phase2Total,
      totalCost: phase1Total + phase2Total + (restructureData.newDownPayment || 0),
      avgMonthly: (phase1Total + phase2Total + (restructureData.newDownPayment || 0)) / totalMonths,
      costPerMile: totalMiles > 0 ? (phase1Total + phase2Total + (restructureData.newDownPayment || 0)) / totalMiles : 0,
      balloonDue: balloonData.balloonAmount,
      phase2DownPayment: restructureData.newDownPayment || 0
    }
  };
}

function buildFinanceWithBalloonRestructure(financeData, balloonMonthsElapsed, balloonAmount, restructureData) {
  var phase1Schedule = generateAmortizationSchedule(
    financeData.principal,
    financeData.months,
    financeData.apr,
  );
  var refinancePrincipal = balloonAmount - (restructureData.newDownPayment || 0);
  var phase2Schedule = generateAmortizationSchedule(
    Math.max(0, refinancePrincipal),
    restructureData.newTermMonths,
    restructureData.newApr,
    0
  );
  var phase1Total = phase1Schedule.reduce(function(sum, row) { return sum + row.payment; }, 0);
  var phase2Total = phase2Schedule.reduce(function(sum, row) { return sum + row.payment; }, 0);
  var totalMonths = financeData.months + restructureData.newTermMonths;
  var totalMiles = financeData.annualMiles * (totalMonths / 12);
  var principalDecline = phase1Schedule.map(function(row) { return row.balance; }).concat(
    phase2Schedule.map(function(row) { return row.balance; })
  );
  return {
    phase1Schedule: phase1Schedule,
    phase2Schedule: phase2Schedule,
    phase1Months: financeData.months,
    phase2Months: restructureData.newTermMonths,
    totalMonths: totalMonths,
    metrics: {
      phase1TotalPayments: phase1Total,
      phase2TotalPayments: phase2Total,
      totalCost: phase1Total + phase2Total + financeData.downPayment + (restructureData.newDownPayment || 0),
      avgMonthly: (phase1Total + phase2Total) / totalMonths,
      costPerMile: totalMiles > 0 ? (phase1Total + phase2Total) / totalMiles : 0,
      balloonDue: balloonAmount,
      phase2DownPayment: restructureData.newDownPayment || 0,
      totalDownPayments: financeData.downPayment + (restructureData.newDownPayment || 0)
    },
    principalDecline: principalDecline
  };
}

function buildLeaseWithDoubleBalloon(leaseData, balloonData, restructureData) {

  );

function buildFullPrincipalRestructure(leaseData, initialBalloonData, restructureData) {
  var phase1Schedule = generateLeaseSchedule(
    leaseData.capCost,
    leaseData.residual,
    leaseData.months,
    leaseData.moneyFactor,
    leaseData.monthlyTax
  );
  var balloonRemaining = calculateBalloonRemaining(
    leaseData.capCost,
    leaseData.residual,
    leaseData.months,
    leaseData.months
  );
  var balloonDeferred = balloonRemaining.remainingToBalloon * (initialBalloonData.balloonPct || 0.5);
  var additionalDown = restructureData.additionalDownPayment || 0;
  var principalForPhase2 = Math.max(0, balloonDeferred - additionalDown);
  var newBalloonAmount = principalForPhase2 * (restructureData.newBalloonPct || 0.3);
  var phase2FinancePrincipal = principalForPhase2 - newBalloonAmount;
  var phase2Schedule = generateAmortizationSchedule(
    Math.max(0, phase2FinancePrincipal),
    restructureData.newTermMonths,
    restructureData.newApr,
  );
  var phase1Total = phase1Schedule.reduce(function(sum, row) { return sum + row.payment; }, 0);
  var phase2Total = phase2Schedule.reduce(function(sum, row) { return sum + row.payment; }, 0);
  var totalMonths = leaseData.months + restructureData.newTermMonths;
  var totalMiles = leaseData.annualMiles * (totalMonths / 12);
  var principalProgression = {
    phase1Start: leaseData.capCost,
    phase1End: balloonRemaining.balloonCapRemaining,
    balloonDeferredAtRestructure: balloonDeferred,
    additionalDownApplied: additionalDown,
    phase2Start: principalForPhase2,
    phase2NewBalloon: newBalloonAmount,
    phase2End: 0
  };
  return {
    phase1Schedule: phase1Schedule,
    phase2Schedule: phase2Schedule,
    phase1Months: leaseData.months,
    phase2Months: restructureData.newTermMonths,
    totalMonths: totalMonths,
    principalProgression: principalProgression,
    metrics: {
      phase1TotalPayments: phase1Total,
      phase2TotalPayments: phase2Total,
      totalCost: phase1Total + phase2Total + additionalDown,
      avgMonthly: (phase1Total + phase2Total + additionalDown) / totalMonths,
      costPerMile: totalMiles > 0 ? (phase1Total + phase2Total + additionalDown) / totalMiles : 0,
      balloonPhase1: balloonDeferred,
      balloonPhase2: newBalloonAmount,
      totalDownPayments: additionalDown,
      principalSaved: additionalDown
    }
  };
}

function buildLeaseAndBuyAtRestructure(leaseData, restructureData) {
  var phase1Schedule = generateLeaseSchedule(

function compareRestructureScenarios(baseLeaseData, balloonData, restructureOptions) {
  var scenarios = [];
  if (!restructureOptions || restructureOptions.length === 0) {
    restructureOptions = [
      { name: 'Pay Off Balloon', type: 'payoff', balloonAmount: balloonData.balloonAmount },
      { name: 'Refinance Balloon (24mo @ 4%)', type: 'refinance_short', balloonAmount: balloonData.balloonAmount, newTermMonths: 24, newApr: 0.04 },
      { name: 'Refinance Balloon (36mo @ 4%)', type: 'refinance_long', balloonAmount: balloonData.balloonAmount, newTermMonths: 36, newApr: 0.04 },
      { name: 'Refinance + Additional $2k Down', type: 'refinance_with_down', balloonAmount: balloonData.balloonAmount, newTermMonths: 24, newApr: 0.04, newDownPayment: 2000 },
      { name: 'New Lease (36mo)', type: 'new_lease', newCapCost: balloonData.balloonAmount * 1.2, newResidue: balloonData.balloonAmount * 0.6, newTermMonths: 36, newMoneyFactor: baseLeaseData.moneyFactor }
    ];
  }
  restructureOptions.forEach(function(opt) {
    var scenario;
    switch (opt.type) {
      case 'payoff':
        scenarios.push({ id: 'restructure_payoff', label: opt.name, type: 'payoff', metrics: { monthly: 0, totalCost: opt.balloonAmount, costPerMile: 0, balloonDue: opt.balloonAmount } });
        break;
      case 'refinance_short':
      case 'refinance_long':
      case 'refinance_with_down':
        scenario = buildLeaseWithBalloonRestructure(baseLeaseData, { balloonAmount: opt.balloonAmount }, { newTermMonths: opt.newTermMonths, newApr: opt.newApr, newDownPayment: opt.newDownPayment || 0 });
        scenarios.push({ id: 'restructure_' + opt.type, label: opt.name, type: opt.type, termMonths: scenario.totalMonths, schedule: scenario.phase1Schedule.concat(scenario.phase2Schedule), metrics: scenario.metrics });
        break;
      case 'new_lease':
        scenario = buildLeaseWithDoubleBalloon(baseLeaseData, { balloonAmount: opt.balloonAmount || balloonData.balloonAmount }, { newCapCost: opt.newCapCost, newResidue: opt.newResidue, newTermMonths: opt.newTermMonths, newMoneyFactor: opt.newMoneyFactor, newDownPayment: opt.newDownPayment || 0 });
        scenarios.push({ id: 'restructure_new_lease', label: opt.name, type: 'new_lease', termMonths: scenario.totalMonths, schedule: scenario.phase1Schedule.concat(scenario.phase2Schedule), metrics: scenario.metrics });
        break;
    }
  });
  return scenarios;
}

function calculateMSDSavings(input) {
  var card = input.closest('.vehicle-card') || input.closest('section');
  if (!card) return;
  var msdCountEl = card.querySelector('.msdCount') || card.querySelector('[name*="msd" i]');
  var msdReductionEl = card.querySelector('.msdReduction');
  var baseMFEl = card.querySelector('.moneyFactor') || card.querySelector('[name*="moneyFactor" i]');
  var msdCount = parseInt(msdCountEl ? msdCountEl.value : 0) || 0;
  var msdReduction = parseFloat(msdReductionEl ? msdReductionEl.value : 0.00007) || 0.00007;
  var baseMF = parseFloat(baseMFEl ? baseMFEl.value : 0) || 0;
  var totalReduction = msdCount * msdReduction;
  var effectiveMF = Math.max(0, baseMF - totalReduction);
  var effectiveMFEl = card.querySelector('.effectiveMF');
  if (effectiveMFEl) effectiveMFEl.value = effectiveMF.toFixed(5);
  var capCostEl = card.querySelector('.capitalizedAmount') || card.querySelector('[name*="capCost" i]');
  var residualEl = card.querySelector('.residualValue') || card.querySelector('[name*="residual" i]');
  var termEl = card.querySelector('.leaseTerm') || card.querySelector('[name*="term" i]');
  var capCost = parseFloat(capCostEl ? capCostEl.value : 0) || 0;
  var residual = parseFloat(residualEl ? residualEl.value : 0) || 0;
  var term = parseInt(termEl ? termEl.value : 36) || 36;
  var baseRent = (capCost + residual) * baseMF;
  var effRent = (capCost + residual) * effectiveMF;
  var monthlySavings = baseRent - effRent;
  var termSavings = monthlySavings * term;
  var msdSavingsEl = card.querySelector('.msdSavings');
  if (msdSavingsEl) msdSavingsEl.value = termSavings.toFixed(2);
  return { msdCount: msdCount, effectiveMF: effectiveMF, monthlySavings: monthlySavings, termSavings: termSavings };
}

function getFederalCredit(make, model, year) {
  var m = (make || '').toLowerCase();
  var mdl = (model || '').toLowerCase();

  var hit = (FEDCREDITS || []).find(function(c) { return (c.make || '').toLowerCase() === m && (c.model || '').toLowerCase() === mdl && c.year === y; });
  return hit ? (hit.amount || 0) : 0;
}

function getStateCredit(stateCode) {
  var sc = (stateCode || '').toUpperCase();
  var x = STATECREDITS && STATECREDITS[sc];
  return { new: (x && (x.new || x.rebate || 0)) || 0, used: (x && (x.used || x.usedRebate || 0)) || 0 };
}

async function lookupCountyFromLatLon(lat, lon) {
  var url = 'https://geo.fcc.gov/api/census/block/find?format=json&latitude=' + encodeURIComponent(lat) + '&longitude=' + encodeURIComponent(lon);
  var resp = await fetch(url);
  if (!resp.ok) throw new Error('FCC lookup failed: ' + resp.status);
  var data = await resp.json();
  return data && data.County && data.County.name ? data.County.name : '';
}

async function zipToLatLon(zip) {
  var resp = await fetch('https://api.zippopotam.us/us/' + encodeURIComponent(zip));
  if (!resp.ok) throw new Error('ZIP lookup failed: ' + resp.status);
  var data = await resp.json();
  var place = data && data.places && data.places[0];
  if (!place || !place.latitude || !place.longitude) return null;
  return { lat: place.latitude, lon: place.longitude };
}

async function lookupCountyFromZip(zip) {
  var coords = await zipToLatLon(zip);
  if (!coords) return '';
  return await lookupCountyFromLatLon(coords.lat, coords.lon);
}

function getEpaModelsForMake(make) {
  var m = (make || '').toLowerCase();
  var v = getEpaElectrifiedVehicles();
  var models = {};
  v.forEach(function(x) { if ((x.make || '').toLowerCase() === m) { var mdl = (x.model || '').trim(); if (mdl) models[mdl] = 1; } });
  return Object.keys(models).sort();
}

function ensureOptgroup(selectEl, label) {
  if (!isSelect(selectEl)) return null;
  var groups = selectEl.querySelectorAll('optgroup');
  var og = null;
  for (var i = 0; i < groups.length; i++) { if ((groups[i].label || '') === label) { og = groups[i]; break; } }
  if (!og) {
    og = document.createElement('optgroup');
    og.label = label;
    selectEl.appendChild(og);
  }
  return og;
}

function fillOptgroup(og, values) {
  if (!og) return;
  og.innerHTML = '';
  values.forEach(function(v) {
    var opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    og.appendChild(opt);
  });
}

function findModelSelect(card) {

}

function getCards() {

async function wireEpaDropdowns() {
  if (!EPAEVDATABASE || !EPAEVDATABASE.vehicles || !EPAEVDATABASE.vehicles.length) return;
  var makes = getEpaElectrifiedMakes();
  getCards().forEach(function(card) {
    var makeSel = findMakeSelect(card);
    var modelSel = findModelSelect(card);
    if (!makeSel || !modelSel) return;
    var makeOG = ensureOptgroup(makeSel, 'Electrified (EPA)');
    fillOptgroup(makeOG, makes);
    var modelOG = ensureOptgroup(modelSel, 'Electrified (EPA)');

    };

    updateModels();
  });
}

function displayBreakevenAnalysis(vehicles, container) {
  if (vehicles.length < 2) return;
  var analysisDiv = document.createElement('div');
  analysisDiv.style.cssText = 'background:linear-gradient(45deg, #f7fafc, #edf2f7);border-radius:14px;padding:30px;border-left:6px solid #667eea;margin-bottom:40px;';
  analysisDiv.innerHTML = '<h3 style="font-size:1.8rem;font-weight:800;color:#2d3748;margin-bottom:20px;">Breakeven Analysis</h3>';
  for (var i = 0; i < vehicles.length - 1; i++) {
    var v1 = vehicles[i];
    var v2 = vehicles[i + 1];
    var payment1 = v1.totalMonthlyPayment || v1.monthlyPayment || (v1.singlePaymentAmount / v1.term);
    var payment2 = v2.totalMonthlyPayment || v2.monthlyPayment || (v2.singlePaymentAmount / v2.term);
    var monthlySavings = Math.abs(payment1 - payment2);
    var totalSavings = Math.abs(v1.totalPayments - v2.totalPayments);
    var breakeven = monthlySavings > 0 ? totalSavings / monthlySavings : v1.term;
    var betterMonthly = payment1 < payment2 ? 'Vehicle ' + (i + 1) : 'Vehicle ' + (i + 2);
    var betterTotal = v1.totalPayments < v2.totalPayments ? 'Vehicle ' + (i + 1) : 'Vehicle ' + (i + 2);
    analysisDiv.innerHTML += '<div style="margin-bottom:25px;padding-bottom:15px;border-bottom:1px solid #cbd5e0;">' +
      '<div style="font-weight:700;font-size:1.1rem;color:#2d3748;margin-bottom:10px;">Vehicle ' + (i + 1) + ' vs Vehicle ' + (i + 2) + '</div>' +
      '<div style="margin-left:15px;">' +
      '<div style="margin-bottom:8px;"><strong>Lower Payment:</strong> ' + betterMonthly + ' - saves $' + monthlySavings.toFixed(2) + '/period</div>' +
      '<div style="margin-bottom:8px;"><strong>Lower Total Cost:</strong> ' + betterTotal + ' - saves $' + totalSavings.toFixed(2) + ' total</div>' +
      '<div><strong>Breakeven:</strong> After ' + Math.round(breakeven) + ' periods</div>' +
      '</div></div>';
  }
  container.appendChild(analysisDiv);
}

    TestSuite.results.push({ test: testName, status: 'PASS' });

    TestSuite.results.push({ test: testName, status: 'FAIL' });

}

function assertEqualTest(actual, expected, testName) {

}

function assertCloseTest(actual, expected, tolerance, testName) {
  var diff = Math.abs(actual - expected);
  assertTest(diff <= tolerance, testName + ' (expected: ' + expected + ' +/-' + tolerance + ', got: ' + actual + ')');
}

// ========== HISTORICAL FUNCTIONS ==========
function createIncentive(config) {
  return {
    id: config.id || generateUniqueId(),
    type: config.type, // INCENTIVE_TYPES value
    make: config.make, // Vehicle make
    model: config.model, // Vehicle model (optional, blank = all models)
    modelYear: config.modelYear, // Year (optional)
    amount: config.amount || 0, // Dollar amount or percentage
    description: config.description || '',
    
    // Temporal constraints
    startDate: new Date(config.startDate),
    endDate: new Date(config.endDate),
    
    // Location constraints
    locationRadius: config.locationRadius || 2000, // miles from origin
    residencyRequired: config.residencyRequired || false, // Must be resident of area
    allowedStates: config.allowedStates || [], // Empty = all states
    excludedZips: config.excludedZips || [], // Zip codes where incentive unavailable
    
    // Deal-specific constraints
    dealTypes: config.dealTypes || ['lease', 'finance'], // Which deal types qualify
    minTermMonths: config.minTermMonths || 0,
    maxTermMonths: config.maxTermMonths || 84,
    minDownPayment: config.minDownPayment || 0,
    minAnnualMiles: config.minAnnualMiles || 0,
    maxAnnualMiles: config. maxAnnualMiles || Infinity,
    
    // Additional metadata
    source: config.source || 'dealer', // 'dealer', 'manufacturer', 'third-party'
    refinanceEligible: config.refinanceEligible !== false,
    transferable: config.transferable || false,
    stackableWith: config.stackableWith || [], // Which incentive IDs can stack
    notes: config.notes || ''
  };
}

function filterByType(incentives, types) {
  const typeArray = Array.isArray(types) ? types : [types];
  return incentives.filter(inc => typeArray.includes(inc.type));
}

function filterByTimeValidity(incentives, checkDate = new Date()) {
  return incentives.filter(inc => {
    const isAfterStart = checkDate >= inc.startDate;
    const isBeforeEnd = checkDate <= inc.endDate;
    return isAfterStart && isBeforeEnd;
  });
}

function getDaysRemaining(incentive, checkDate = new Date()) {
  const daysMs = incentive.endDate - checkDate;
  return Math.ceil(daysMs / (1000 * 60 * 60 * 24));
}

function filterByLocation(incentives, userLocation, dealerLocation = null) {
  return incentives. filter(inc => {
    // State check
    if (inc.allowedStates. length > 0 && !inc.allowedStates.includes(userLocation.state)) {
      return false;
    }
    
    // Excluded zip check
    if (inc.excludedZips.includes(userLocation.zipCode)) {
      return false;
    }
    
    // Residency check
    if (inc. residencyRequired && dealerLocation) {
      // Check if user and dealer are in same state/region
      if (userLocation.state !== dealerLocation.state) {
        return false;
      }
    }
    
    // Location radius check (if coordinates provided)
    if (inc.locationRadius && userLocation.lat && userLocation.lon && dealerLocation) {
      const distance = calculateDistanceInMiles(
        userLocation.lat,
        userLocation.lon,
        dealerLocation.lat,
        dealerLocation.lon
      );
      if (distance > inc.locationRadius) {
        return false;
      }
    }
    
    return true;
  });
}

function filterByDealParams(incentives, dealParams) {
  return incentives.filter(inc => {
    // Deal type check
    if (!inc. dealTypes.includes(dealParams. dealType)) {
      return false;
    }
    
    // Term range check
    if (dealParams.termMonths < inc. minTermMonths || dealParams.termMonths > inc. maxTermMonths) {
      return false;
    }
    
    // Down payment check
    if (dealParams.downPayment < inc.minDownPayment) {
      return false;
    }
    
    // Mileage range check
    const annualMiles = dealParams.annualMiles || 12000;
    if (annualMiles < inc.minAnnualMiles || annualMiles > inc.maxAnnualMiles) {
      return false;
    }
    
    return true;
  });
}

function getApplicableIncentives(incentives, filters = {}) {
  let applicable = [... incentives];
  
  // Apply temporal filter
  if (! filters.excludeExpired !== false) {
    applicable = filterByTimeValidity(applicable, filters.checkDate);
  }
  
  // Apply type filter
  if (filters.types) {
    applicable = filterByType(applicable, filters.types);
  }
  
  // Apply location filter
  if (filters.userLocation) {
    applicable = filterByLocation(
      applicable,
      filters.userLocation,
      filters.dealerLocation
    );
  }
  
  // Apply deal parameter filter
  if (filters.dealParams) {
    applicable = filterByDealParams(applicable, filters.dealParams);
  }
  
  // Sort by expiration date (soonest first)
  applicable.sort((a, b) => a.endDate - b.endDate);
  
  // Categorize by type
  const byType = {};
  Object.values(INCENTIVE_TYPES).forEach(type => {
    byType[type] = applicable.filter(inc => inc.type === type);
  });
  
  // Flag expiring soon (within 7 days)
  const expiringIn7Days = applicable.filter(inc => {
    const daysLeft = getDaysRemaining(inc, filters.checkDate);
    return daysLeft >= 0 && daysLeft <= 7;
  });
  
  // Identify warnings
  const warnings = [];
  if (expiringIn7Days. length > 0) {
    warnings.push({
      type: 'EXPIRING_SOON',
      message: `${expiringIn7Days.length} incentive(s) expiring within 7 days`,
      details: expiringIn7Days
    });
  }
  
  // Check for stackability
  const stackingOpportunities = identifyStackableIncentives(applicable);
  
  return {
    applicable,
    byType,
    warnings,
    expiringIn7Days,
    stackingOpportunities,
    totalCount: applicable.length
  };
}

function identifyStackableIncentives(incentives) {
  const stackingGroups = [];
  const processed = new Set();
  
  incentives.forEach(inc => {
    if (processed.has(inc.id) || inc.stackableWith.length === 0) {
      return;
    }
    
    const group = [inc];
    processed.add(inc.id);
    
    // Find all incentives this one can stack with
    inc.stackableWith.forEach(stackableId => {
      const stackable = incentives.find(i => i.id === stackableId);
      if (stackable && !processed.has(stackableId)) {
        group.push(stackable);
        processed.add(stackableId);
      }
    });
    
    if (group.length > 1) {
      stackingGroups. push(group);
    }
  });
  
  return stackingGroups;
}

function calculateIncentiveValue(selectedIncentives, dealMetrics) {
  let totalValue = 0;
  const byIncentive = {};
  const breakdown = [];
  
  selectedIncentives.forEach(inc => {
    let value = 0;
    
    switch (inc.type) {
      case INCENTIVE_TYPES. CASH_BACK:
        value = inc.amount;
        break;
      
      case INCENTIVE_TYPES.MF_SUBVENTION:
        // Reduce money factor by inc.amount (typically 0.0001-0.0005)
        // Value = (original MF - reduced MF) * (cap cost + residual) * months
        const mfReduction = (dealMetrics.originalMoneyFactor - inc.amount);
        value = mfReduction * (dealMetrics.capCost + dealMetrics.residual) * dealMetrics.leaseTermMonths;
        break;
      
      case INCENTIVE_TYPES.APR_SUBVENTION:
        // Reduce APR by inc.amount (e.g., 2.5% = 0.025)
        // Calculate interest savings over loan term
        const originalRate = dealMetrics.apr;
        const reducedRate = Math.max(0, originalRate - inc.amount);
        const rateReduction = originalRate - reducedRate;
        value = (dealMetrics.loanAmount * rateReduction * dealMetrics. financeTermMonths) / 12;
        break;
      
      case INCENTIVE_TYPES.DOWN_PAYMENT_WAIVER:
        value = inc. amount || dealMetrics.downPayment;
        break;
      
      case INCENTIVE_TYPES. FIRST_MONTH_FREE: 
        value = dealMetrics.monthlyPayment;
        break;
      
      case INCENTIVE_TYPES.ACQ_FEE_WAIVER:
        value = inc. amount || 695; // typical acq fee
        break;
      
      case INCENTIVE_TYPES. REGISTRATION_WAIVER:
        value = inc.amount || 250; // typical registration
        break;
      
      case INCENTIVE_TYPES. LEASE_END_BONUS:
        value = inc.amount;
        break;
    }
    
    totalValue += value;
    byIncentive[inc.id] = value;
    
    breakdown.push({
      id: inc.id,
      type: inc.type,
      description: inc.description,
      value: Math.round(value * 100) / 100
    });
  });
  
  return {
    totalValue:  Math.round(totalValue * 100) / 100,
    byIncentive,
    breakdown,
    percentOfPrice: (totalValue / dealMetrics.sellingPrice) * 100
  };
}

function formatIncentiveDisplay(incentive) {
  const typeLabel = {

			    function normalizeAndScore(scenarios, weights = { monthly: 0.33, totalCost: 0.33, costPerMile: 0.33 }) {

			          max: Math.max(...scenarios.map(s => s.metrics?.monthly || s.monthly || 0))

			          max: Math.max(...scenarios.map(s => s.metrics?.costPerMile || s.costPerMile || 0))

			      };

			      // Normalize and score each scenario
			      return scenarios.map(scenario => {
			        var monthly = scenario.metrics?.monthly || scenario.monthly || 0;
			        var totalCost = scenario.metrics?.totalCost || scenario.totalCost || 0;
			        var costPerMile = scenario.metrics?.costPerMile || scenario.costPerMile || 0;

			        // Normalize: lower cost = higher score (inverted)
			        var normMonthly = ranges.monthly.max > ranges.monthly.min ?
			          (1 - (monthly - ranges.monthly.min) / (ranges.monthly.max - ranges.monthly.min)) * 100 :
			          50;

			        var normTotal = ranges.totalCost.max > ranges.totalCost.min ?
			          (1 - (totalCost - ranges.totalCost.min) / (ranges.totalCost.max - ranges.totalCost.min)) * 100 :
			          50;

			        var normMile = ranges.costPerMile.max > ranges.costPerMile.min ?
			          (1 - (costPerMile - ranges.costPerMile.min) / (ranges.costPerMile.max - ranges.costPerMile.min)) * 100 :
			          50;

			        // Weighted score
			        var weightedScore = (normMonthly * weights.monthly) + (normTotal * weights.totalCost) + (normMile * weights.costPerMile);

			        return {
			          ...scenario,
			          normalized: { monthly: normMonthly, totalCost: normTotal, costPerMile: normMile },
			          weightedScore: Math.round(weightedScore * 10) / 10
			        };
			      });
			    }

async function getEpaSpecAlwaysOn({ year, make, model, trim }) {
  const key = _enrichKey(year, make, model, trim);
  if (_enrichInflight.has(key)) return _enrichInflight.get(key);

  const p = (async () => {
	// Local “latest MY per make/model” helper exists in your bundle. [file:129]
	const localSpec = (typeof getEpaVehicleSpec === "function") ? getEpaVehicleSpec(make, model) : null; // [file:129]
	const fegRaw = await _fegFetchVehicleRecord({ year, make, model, trim }); // [web:215]
	const fegSpec = _normalizeFegToLocalShape(fegRaw);
	return _mergeSpecs(localSpec, fegSpec);
  })().finally(() => _enrichInflight.delete(key));

  _enrichInflight.set(key, p);
  return p;
}

function calculateBalloon(vehicle) {
  const monthDue = parseInt(vehicle.monthBalloonDue) || 36;
  const restructuredTerm = parseInt(vehicle.restructuredTerm) || 0;
  const balloonApr = parseFloat(vehicle.balloonApr) || 0.035;
  const balloonMf = parseFloat(vehicle.balloonMf) || 0.0005;
  
  // Calculate balloon cap/principal
  const cap = parseFloat(vehicle.capitalizedAmount) || 0;
  const downPayment = parseFloat(vehicle.downPayment) || 0;
  const balloonCap = cap - downPayment;
  
  // Balloon payment calculation (simple interest)
  const balloonPayment = balloonCap * (balloonApr / 12) * monthDue;
  
  // New principal after restructure
  let newPrincipal = balloonCap;
  if (restructuredTerm > 0) {
    const addlDown = parseFloat(vehicle.balloonAddlDown) || 0;
    newPrincipal = balloonCap - addlDown;
  }
  
  return {
    balloonCapPrincipal: balloonCap,
    balloonPayment: balloonPayment,
    balloonNewPrincipal: newPrincipal
  };
}

function calculateFuelCost(vehicle) {
  const fuelType = vehicle.fuelType || 'gas';
  const annualMileage = parseInt(vehicle.annualMileage) || 12000;
  
  let costPer100Mi = 0;
  let annualCost = 0;
  let kwhPer100Mi = 0;
  
  if (fuelType === 'gas') {
    const mpg = parseFloat(vehicle.epaCombinedMpg) || (parseFloat(vehicle.epaCityMpg) || 20);
    const fuelCost = parseFloat(vehicle.fuelCostPerGal) || 3.50;
    costPer100Mi = (100 / (mpg || 1)) * fuelCost;
    annualCost = (annualMileage / 100) * costPer100Mi;
  } else if (fuelType === 'ev') {
    const mpge = parseFloat(vehicle.mpgeCombined) || 25;
    const elecCost = parseFloat(vehicle.electricityCostPerkWh) || 0.14;
    kwhPer100Mi = 100 / (mpge || 1);
    costPer100Mi = kwhPer100Mi * elecCost;
    annualCost = (annualMileage / 100) * costPer100Mi;
  } else if (fuelType === 'phev') {
    const gasRange = parseFloat(vehicle.rangePhevGas) || 300;
    const evRange = parseFloat(vehicle.rangePhevEv) || 50;
    const combined = (gasRange + evRange) || 1;
    const gasPercent = gasRange / combined;
    const evPercent = evRange / combined;
    
    const mpg = parseFloat(vehicle.phevFuelCostPerGal) || 3.50;
    const elec = parseFloat(vehicle.phevElectricityCostPerkWh) || 0.14;
    
    const gasCost = (100 / 25) * mpg * gasPercent;
    const evCost = (100 / 25) * elec * evPercent;
    costPer100Mi = gasCost + evCost;
    annualCost = (annualMileage / 100) * costPer100Mi;
    kwhPer100Mi = (100 / 25) * evPercent;
  }
  
  return {
    fuelCostPer100Mi: costPer100Mi,
    kwhPer100Mi: kwhPer100Mi,
    annualFuelCost: annualCost
  };
}

function calculateEquity(vehicle) {
  const tradeAllowance = parseFloat(vehicle.tradeAllowance) || 0;
  const payoffAmount = parseFloat(vehicle.payoffAmount) || 0;
  const equity = tradeAllowance - payoffAmount;
  
  const scenario = vehicle.tradeScenario || 'cap_reduction';
  const cap = parseFloat(vehicle.capitalizedAmount) || 0;
  const res = parseFloat(vehicle.residualValue) || 0;
  
  let equityApplied = 0;
  if (scenario === 'cap_reduction') {
    equityApplied = equity; // Full to cap cost
  } else if (scenario === 'split_50_50') {
    equityApplied = equity / 2; // 50% to cap, 50% to buyout
  } else if (scenario === 'at_buyout') {
    equityApplied = 0; // Apply after lease ends
  } else if (scenario === 'check_back') {
    equityApplied = 0; // Separate account
  }
  
  return {
    tradeEquity: equity,
    equityApplied: equityApplied,
    adjustedCap: Math.max(0, cap - equityApplied)
  };
}

function calculateMSD(vehicle) {
  const msdActive = vehicle.msdActive === true || vehicle.msdActive === 'on';
  if (!msdActive) return {msdSavings: 0};
  
  const msdCount = parseInt(vehicle.msdCount) || 1;
  const mf = parseFloat(vehicle.moneyFactor) || 0.0005;
  const cap = parseFloat(vehicle.capitalizedAmount) || 0;
  const res = parseFloat(vehicle.residualValue) || 0;
  const term = parseInt(vehicle.leaseTerm) || 36;
  
  // Industry standard: each MSD reduces MF by 0.00004
  const mfReduction = 0.00004 * msdCount;
  
  // Apply minimum floor (typically 0.00001)
  const minFloor = 0.00001;
  const adjustedMF = Math.max(minFloor, mf - mfReduction);
  
  // Calculate savings
  const originalRent = (cap + res) * mf * term;
  const adjustedRent = (cap + res) * adjustedMF * term;
  const mfSavings = originalRent - adjustedRent;
  
  return {
    msdSavings: mfSavings,
    adjustedMF: adjustedMF,
    mfReduction: mfReduction
  };
}

function autoResidual(vehicle) {
  const term = parseInt(vehicle.leaseTerm) || 36;
  const mileage = parseInt(vehicle.annualMileage) || 12000;
  const condition = vehicle.condition || 'new';
  const msrp = parseFloat(vehicle.msrp) || 0;
  
  // NOTE: Requires external getResidual function
  const residualPct = typeof getResidual === 'function' ? getResidual(term, mileage, condition) : 0.50;
  const residualValue = msrp * residualPct;
  
  return {
    residualPct: residualPct,
    residualValue: residualValue
  };
}

async function supplementWithNHTSA(vin, card, mc) {
  try {
    const nhtsaResponse = await fetch(
      `https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${vin}?format=json`
    );
    
    if (nhtsaResponse.ok) {
      const nhtsaData = await nhtsaResponse.json();
      const nhtsa = nhtsaData.Results[0] || {};
      
      // Fill missing trim
      if (!mc.trim && nhtsa.Trim) {
        card.querySelector('.trim').value = nhtsa.Trim;
      }
      
      // Fill missing colors
      if (!mc.exterior_color && nhtsa.ExteriorColor) {
        card.querySelector('.exteriorColor').value = nhtsa.ExteriorColor;
      }
      if (!mc.interior_color && nhtsa.InteriorColor) {
        card.querySelector('.interiorColor').value = nhtsa.InteriorColor;
      }
      
      // Fill missing body style
      if (!mc.body_type && nhtsa.BodyClass) {
        card.querySelector('.bodyStyle').value = nhtsa.BodyClass;
      }
      
      // Supplement fuel type if missing
      if (!mc.fuel_type && nhtsa.FuelTypePrimary) {
        const fuelType = nhtsa.FuelTypePrimary.toLowerCase();
        if (fuelType.includes('electric')) card.querySelector('.fuelType').value = 'ev';
        else if (fuelType.includes('hybrid')) card.querySelector('.fuelType').value = 'phev';
        else card.querySelector('.fuelType').value = 'gas';
      }
    }
  } catch (error) {
    console.warn('NHTSA supplement failed:', error);
  }
}

async function decodeVINwithNHTSA(vin, card, loader, errorEl) {

  try {
    const nhtsaResponse = await fetch(
      `https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${vin}?format=json`
    );
    
    if (!nhtsaResponse.ok) throw new Error('NHTSA failed');
    
    const nhtsaData = await nhtsaResponse.json();
    const nhtsa = nhtsaData.Results[0] || {};
    
    card.querySelector('.year').value = nhtsa.ModelYear || '';

    card.querySelector('.model').value = nhtsa.Model || '';
    card.querySelector('.trim').value = nhtsa.Trim || '';
    card.querySelector('.bodyStyle').value = nhtsa.BodyClass || '';

function calculateBalloonRestructure(card) {
    const balloonTerm = parseInt(card.querySelector('.balloonTerm')?.value) || 60;
    const balloonMonthDue = parseInt(card.querySelector('.balloonMonthDue')?.value) || 36;
    const sellingPrice = parseFloat(card.querySelector('.sellingPrice')?.value) || 0;
    const downPayment = parseFloat(card.querySelector('.downPayment')?.value) || 0;
    const apr = parseFloat(card.querySelector('.apr')?.value) / 100 || 0;
    const balloonAddDown = parseFloat(card.querySelector('.balloonAddDown')?.value) || 0;
    const balloonNewTerm = parseInt(card.querySelector('.balloonNewTerm')?.value) || 24;
    
    // Calculate remaining balance at balloon due date
    const principal = sellingPrice - downPayment;
    const monthlyRate = apr / 12;
    
    // Amortization for original term
    const originalPayment = monthlyRate > 0 
        ? principal * (monthlyRate * Math.pow(1 + monthlyRate, balloonTerm)) / (Math.pow(1 + monthlyRate, balloonTerm) - 1)
        : principal / balloonTerm;
    
    // Calculate remaining balance at balloon due month
    let remainingBalance = principal;
    for (let i = 0; i < balloonMonthDue; i++) {
        const interestPayment = remainingBalance * monthlyRate;
        const principalPayment = originalPayment - interestPayment;
        remainingBalance -= principalPayment;
    }
    
    // Display remaining balance
    if (card.querySelector('.balloonRemCap')) {
        card.querySelector('.balloonRemCap').value = '$' + remainingBalance.toFixed(2);
    }
    
    // Calculate refinance payment
    const refinanceAmount = remainingBalance - balloonAddDown;
    const refinancePayment = monthlyRate > 0
        ? refinanceAmount * (monthlyRate * Math.pow(1 + monthlyRate, balloonNewTerm)) / (Math.pow(1 + monthlyRate, balloonNewTerm) - 1)
        : refinanceAmount / balloonNewTerm;
    
    if (card.querySelector('.balloonNewPay')) {
        card.querySelector('.balloonNewPay').value = '$' + refinancePayment.toFixed(2);
    }
    
    return {
        originalPayment,
        remainingBalance,
        refinancePayment,
        totalPhase1Cost: originalPayment * balloonMonthDue,
        totalPhase2Cost: refinancePayment * balloonNewTerm,
        totalCost: (originalPayment * balloonMonthDue) + (refinancePayment * balloonNewTerm) + downPayment + balloonAddDown
    };
}

async function fetchMarketCheckNeoVIN(card) {
    const vin = card.querySelector('.vin')?.value.trim().toUpperCase();
    if (!vin || vin.length !== 17) return;
    
    const loadingIndicator = card.querySelector('.loading-indicator');
    if (loadingIndicator) loadingIndicator.textContent = 'Fetching VIN data...';
    
    try {
        const apiKey = getNextApiKey();
        const res = await fetch(`https://api.marketcheck.com/v2/decode/car/neovin/${vin}/specs?api_key=${apiKey}&include_generic=true`);
        
        if (!res.ok) {
            console.log("MarketCheck failed, falling back to NHTSA");
            fetchNHTSAVIN(card);
            return;
        }
        
        const data = await res.json();
        
        // Basic vehicle info
        card.querySelector('.year').value = data.year || '';
        card.querySelector('.make').value = data.make || '';
        card.querySelector('.model').value = data.model || '';
        card.querySelector('.trim').value = data.trim || '';
        
        // PROTECT MSRP: Only update if API returns > 0
        if (data.msrp && data.msrp > 0) {
            card.querySelector('.msrp').value = data.msrp;
            if (card.querySelector('.origMsrpHidden')) {
                card.querySelector('.origMsrpHidden').value = data.msrp;
            }
            if (card.querySelector('.origMsrpDisplay')) {
                card.querySelector('.origMsrpDisplay').value = data.msrp;
            }
        }
        
        // Color
        const color = data.specs?.exterior_color?.name || data.exterior_color?.name || 'Unknown';
        if (card.querySelector('.color')) {
            card.querySelector('.color').value = color;
        }
        
        // Fuel type detection
        const fType = (data.fuel_type || '').toLowerCase();
        const isEV = fType.includes('electric') && !fType.includes('hybrid');
        const isPHEV = fType.includes('plug-in');
        const isHEV = fType.includes('hybrid') && !fType.includes('plug-in');
        
        const generic = data.generic || {};
        const specs = data.specs || {};
        const extra = data.extra || {};
        
        const parseVal = (v) => parseFloat(String(v).replace(/[^0-9.]/g, '')) || 0;
        
        // Fuel capacity
        let fuelCap = data.fuel_capacity || specs.fuel_tank_capacity || generic['Fuel Tank Capacity'] || extra.fuel_capacity;
        if (card.querySelector('.fuel_capacity')) {
            card.querySelector('.fuel_capacity').value = parseVal(fuelCap);
        }
        
        // Battery capacity
        let batt = data.battery_capacity || specs.battery_capacity || generic['Battery Capacity (kWh)'] || extra.battery_capacity;
        if (!batt && isEV) batt = 75;
        if (card.querySelector('.battery_capacity')) {
            card.querySelector('.battery_capacity').value = parseVal(batt);
        }
        
        // Set fuel type radio buttons
        if (isEV && card.querySelector('.fuelTypeEV')) {
            card.querySelector('.fuelTypeEV').checked = true;
            handleFuelTypeChange(card.querySelector('.fuelTypeEV'));
        } else if (isPHEV && card.querySelector('.fuelTypePHEV')) {
            card.querySelector('.fuelTypePHEV').checked = true;
            handleFuelTypeChange(card.querySelector('.fuelTypePHEV'));
        } else if (isHEV && card.querySelector('.fuelTypeHEV')) {
            card.querySelector('.fuelTypeHEV').checked = true;
            handleFuelTypeChange(card.querySelector('.fuelTypeHEV'));
        }
        
        // MPG/MPGe
        const cityMpg = parseVal(data.city_mpg || specs.city_mpg || generic['EPA City MPG']);
        const hwyMpg = parseVal(data.highway_mpg || specs.highway_mpg || generic['EPA Highway MPG']);
        const combMpg = parseVal(data.combined_mpg || specs.combined_mpg || generic['EPA Combined MPG']) || 
                        (cityMpg && hwyMpg ? (cityMpg * 0.45 + hwyMpg * 0.55) : 0);
        
        if (card.querySelector('.mpg')) {
            card.querySelector('.mpg').value = `${cityMpg} / ${hwyMpg} / ${combMpg.toFixed(1)}`;
        }
        
        if (loadingIndicator) loadingIndicator.textContent = '✓ Data loaded';
        calculateFuelCosts(card.querySelector('.avgGasPrice'));
        
    } catch (err) {
        console.error('MarketCheck API error:', err);
        if (loadingIndicator) loadingIndicator.textContent = 'Error fetching data';
    }
}

async function fetchLocationData(card) {
    const zip = card.querySelector('.zip')?.value.trim();
    if (!zip || zip.length !== 5) return;
    
    try {
        // Get city/state from ZIP
        const res = await fetch(`https://api.zippopotam.us/us/${zip}`);
        const data = await res.json();
        const place = data.places[0];
        const state = place['state abbreviation'];
        
        if (card.querySelector('.city')) {
            card.querySelector('.city').value = place['place name'];
        }
        if (card.querySelector('.state')) {
            card.querySelector('.state').value = state;
        }
        
        // Set tax rate
        const tax = TAX_RATES[state] || 6.00;
        if (card.querySelector('.taxRate')) {
            card.querySelector('.taxRate').value = tax;
        }
        
        // Get county via FCC Geo API
        if (place.latitude && place.longitude) {
            const geoRes = await fetch(
                `https://geo.fcc.gov/api/census/block/find?format=json&latitude=${place.latitude}&longitude=${place.longitude}&showall=true`
            );
            const geoData = await geoRes.json();
            
            if (geoData.County && geoData.County.name && card.querySelector('.county')) {
                card.querySelector('.county').value = geoData.County.name;
            }
        }
        
        // Set state-specific doc fee (you'll need to define this object)
        const DOC_FEE_BY_STATE = {
            'CA': 85, 'FL': 899, 'GA': 499, 'TX': 150, 'NY': 175,
            'DEFAULT': 299
        };
        
        if (card.querySelector('.docFee')) {
            card.querySelector('.docFee').value = DOC_FEE_BY_STATE[state] || DOC_FEE_BY_STATE.DEFAULT;
        }
        
    } catch (err) {
        console.error('Location API error:', err);
    }
}

function renderPairwiseComparisons(cards) {
    const container = document.getElementById('pairwiseGrid');
    if (!container) return;
    
    container.innerHTML = "";
    if (cards.length < 2) return;

    for (let i = 0; i < cards.length; i++) {
        for (let j = i + 1; j < cards.length; j++) {
            const c1 = cards[i];
            const c2 = cards[j];
            
            const name1 = `${c1.querySelector('.year')?.value || ''} ${c1.querySelector('.model')?.value || ''}`.trim() || `Vehicle ${String.fromCharCode(65 + i)}`;
            const name2 = `${c2.querySelector('.year')?.value || ''} ${c2.querySelector('.model')?.value || ''}`.trim() || `Vehicle ${String.fromCharCode(65 + j)}`;
            
            const p1 = parseFloat(c1.dataset.monthlyPayment) || 0;
            const p2 = parseFloat(c2.dataset.monthlyPayment) || 0;
            const diffP = p1 - p2;
            
            const t1 = parseFloat(c1.dataset.totalCost) || 0;
            const t2 = parseFloat(c2.dataset.totalCost) || 0;
            const diffT = t1 - t2;
            
            const cardDiv = document.createElement('div');
            cardDiv.className = 'pairwise-card';
            cardDiv.innerHTML = `
                <div class="pairwise-header">${name1} vs ${name2}</div>
                <div class="diff-row">
                    <span>Monthly:</span>
                    <span class="${diffP < 0 ? 'diff-green' : 'diff-red'}">
                        ${diffP < 0 ? '✓ ' + name1 + ' is $' + Math.abs(diffP).toFixed(2) + ' less' : '✗ ' + name1 + ' is $' + diffP.toFixed(2) + ' more'}
                    </span>
                </div>
                <div class="diff-row">
                    <span>Total Cost:</span>
                    <span class="${diffT < 0 ? 'diff-green' : 'diff-red'}">
                        ${diffT < 0 ? '✓ ' + name1 + ' saves $' + Math.abs(diffT).toFixed(2) : '✗ ' + name1 + ' costs $' + diffT.toFixed(2) + ' more'}
                    </span>
                </div>
            `;
            container.appendChild(cardDiv);
        }
    }
    
    document.getElementById('pairwiseSection')?.classList.remove('hidden');
}

    function validateVin(vin) {
        if (vin.length !== 17) return false;
        if (/[IOQ]/.test(vin)) return false;
        let sum = 0;
        for (let i = 0; i < 17; i++) {
            const char = vin[i].toUpperCase();
            const value = isNaN(char) ? VIN_TRANS[char] : parseInt(char);
            if(value === undefined) return false;
            sum += value * VIN_WEIGHTS[i];
        }
        const checkDigit = vin[8];
        const calculatedDigit = sum % 11;
        const expected = (calculatedDigit === 10) ? 'X' : calculatedDigit.toString();
        return checkDigit.toUpperCase() === expected;
    }

    async function handleVinDecode(input) {
        const card = input.closest('.vehicle-card');
        const vin = input.value.trim().toUpperCase();
        if (vin.length !== 17) return;
        if (!validateVin(vin)) { showToast('Invalid VIN (check digit).', 'error'); return; }

        showLoading(card, true);
        const loadingDiv = input.parentElement.querySelector('.field-loading');
        if (loadingDiv) loadingDiv.textContent = 'Decoding VIN...';
        
        try {
            const res = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/${vin}?format=json`);
            const data = await res.json();
            const row = data.Results?.[0];

            if (row && row.Make) {
                card.querySelector('.year').value = row.ModelYear;
                card.querySelector('.make').value = row.Make;
                card.querySelector('.model').value = row.Model;
                card.querySelector('.trim').value = row.Trim || row.Series;
                detectFuelType(card, row);
                populateFeeDefaults(card);
                populateResidual(card);

                await fetchMarketCheckData(card, vin); 

                if (loadingDiv) loadingDiv.textContent = 'Fetching EPA fuel economy...';
                try {
                    const year = card.querySelector('.year').value;
                    const make = card.querySelector('.make').value;
                    const model = card.querySelector('.model').value;
                    const epaData = await fetchEpaData(year, make, model);
                    if (epaData) {
                        applyEpaDataToCard(card, epaData);
                        showToast('VIN decoded with EPA data.');
                    } else {
                        showToast('VIN decoded, EPA data not found.');
                    }
                } catch(epaErr) {
                    console.warn("EPA fetch failed", epaErr);
                    showToast('VIN decoded, no EPA data.');
                }
            } else {
                showToast('VIN not found.', 'error');
            }
        } catch (error) {
            showToast('VIN decode failed.', 'error');
        } finally {
            showLoading(card, false);
            if (loadingDiv) loadingDiv.textContent = '';
        }
    }

    async function fetchEpaData(year, make, model) {
        try {
            const optionsUrl = `https://www.fueleconomy.gov/ws/rest/vehicle/menu/options?year=${year}&make=${encodeURIComponent(make)}&model=${encodeURIComponent(model)}`;
            const optionsRes = await fetch(optionsUrl);
            if (!optionsRes.ok) return null;
            const optionsText = await optionsRes.text();
            const parser = new DOMParser();
            const optionsDoc = parser.parseFromString(optionsText, "text/xml");
            
            const menuItem = optionsDoc.querySelector('menuItem');
            if (!menuItem) return null;
            const vehicleId = menuItem.querySelector('value')?.textContent;
            if (!vehicleId) return null;
            
            const vehicleUrl = `https://www.fueleconomy.gov/ws/rest/vehicle/${vehicleId}`;
            const vehicleRes = await fetch(vehicleUrl);
            if (!vehicleRes.ok) return null;
            const vehicleText = await vehicleRes.text();
            const vehicleDoc = parser.parseFromString(vehicleText, "text/xml");
            
            const getText = (tag) => vehicleDoc.querySelector(tag)?.textContent || null;
            const getNum = (tag) => {
                const val = getText(tag);
                return val ? parseFloat(val) : null;
            }

            return {
                citympg: getNum('city08'), highwaympg: getNum('highway08'), combinedmpg: getNum('comb08'),
                citympge: getNum('cityA08'), highwaympge: getNum('highwayA08'), combinedmpge: getNum('combA08'),
                kwh100mi: getNum('kwhPer100') || getNum('kwhHundredMiles'),
                eparangemiles: getNum('range'), electricrangemiles: getNum('rangeElectric'),
                annualfuelcost: getNum('fuelCost08'), fueltype: getText('fuelType'), fueltype1: getText('fuelType1')
            };

        } catch (err) {
            console.error("EPA API error:", err);
            return null;
        }
    }

    function calculateCapitalizedAmount(card) {
        const listing = parseFloat(card.querySelector('.listingPrice').value) || 0;
        const incentives = parseFloat(card.querySelector('.leaseIncentives').value) || 0;
        const stateCredit = parseFloat(card.querySelector('.stateCredit').value) || 0;

        card.querySelectorAll('.fee-cap-check input:checked').forEach(chk => {
            const feeInput = chk.closest('.fee-cap-row').querySelector('input[type="number"]');
            capFees += parseFloat(feeInput.value) || 0;
        });

        let capRedux = 0;
        const down = parseFloat(card.querySelector('.downPayment').value) || 0;
        const equity = parseFloat(card.querySelector('.tradeEquity').value) || 0;
        const checkBack = parseFloat(card.querySelector('.checkBackAmount').value) || 0;
        
        const downScen = card.querySelector('.downScenario').value;
        const tradeScen = card.querySelector('.tradeScenario').value;

        if (downScen === 'cap_reduction') capRedux += down;
        else if (downScen === 'split_50_50') capRedux += (down / 2);

        if (tradeScen === 'cap_reduction') capRedux += equity;
        else if (tradeScen === 'split_50_50') capRedux += (equity / 2);
        else if (tradeScen === 'check_back') capRedux += (equity - checkBack);

        card.querySelector('.capitalizedAmount').value = (listing - incentives - stateCredit + capFees - capRedux).toFixed(2);
    }
