function getBreakdownValue(card, fieldName) {
  const element = card.querySelector(`[data-field="${fieldName}"]`);
  if (!element) return 0;
  
  const text = element.textContent.trim();
  const match = text.match(/[\d,.-]+/);
  if (!match) return 0;
  
  return parseFloat(match[0].replace(/,/g, ''));
}

function calculateLeaseFromCard(card) {
  const capAmount = getNum(card.querySelector('.capAmount'));
  const residualValue = getNum(card.querySelector('.residualValue'));
  const leaseTerm = parseInt(card.querySelector('.leaseTerm').value);
  const moneyFactor = getNum(card.querySelector('.moneyFactor'));
  const annualMiles = parseInt(card.querySelector('.annualMileage').value);
  const downPayment = getNum(card.querySelector('.downPayment'));
  const leaseIncentives = getNum(card.querySelector('.leaseIncentives'));
  const taxRate = getNum(card.querySelector('.taxRate')) / 100;
  
  // Fees
  const acqFee = getNum(card.querySelector('.acqFee'));
  const docFee = getNum(card.querySelector('.docFee'));
  const regFee = getNum(card.querySelector('.regFee'));
  const titleFee = getNum(card.querySelector('.titleFee'));
  const plateFee = getNum(card.querySelector('.plateFee'));
  const totalFees = acqFee + docFee + regFee + titleFee + plateFee;
  
  // Cap cost after incentives
  const capCost = capAmount - leaseIncentives;
  
  // Generate lease schedule
  const taxPerMonth = (capCost / leaseTerm) * taxRate;
  const leaseSchedule = generateLeaseSchedule(
    capCost,
    residualValue,
    leaseTerm,
    moneyFactor,
    taxPerMonth
  );
  
  // Extract outputs
  const monthlyPayment = leaseSchedule[0]?.payment || 0;
  const totalLeasePayments = leaseSchedule.reduce((sum, row) => sum + row.payment, 0);
  const dueAtSigning = downPayment + acqFee + docFee;
  const totalCost = totalLeasePayments + dueAtSigning + totalFees;
  const totalMiles = annualMiles * (leaseTerm / 12);
  const costPerMile = totalMiles > 0 ? totalCost / totalMiles : 0;
  
  // Breakdown calculations
  const msrpToCap = capAmount > 0 ? ((capAmount - (capAmount - leaseIncentives)) / capAmount) * 100 : 0;
  const capToRes = capCost > 0 ? ((capCost - residualValue) / capCost) * 100 : 0;
  
  return {
    monthlyPayment,
    monthlyDepreciation: (capCost - residualValue) / leaseTerm,
    monthlyRent: (capCost + residualValue) * moneyFactor,
    monthlyTax: taxPerMonth,
    dueAtSigning,
    totalCost,
    costPerMile,
    msrpToCap,
    capToRes,
    schedule: leaseSchedule,
    residualValue,
    residualPct: residualValue / capCost
  };
}

function calculateFinanceFromCard(card) {
  const sellingPrice = getNum(card.querySelector('.sellingPrice'));
  const downPayment = getNum(card.querySelector('.downPayment'));
  const financeTermMonths = parseInt(card.querySelector('.leaseTerm').value); // Reuse term selector
  const apr = getNum(card.querySelector('.apr')) / 100;
  const annualMiles = parseInt(card.querySelector('.annualMileage').value);
  const taxRate = getNum(card.querySelector('.taxRate')) / 100;
  
  // Fees
  const docFee = getNum(card.querySelector('.docFee'));
  const regFee = getNum(card.querySelector('.regFee'));
  const titleFee = getNum(card.querySelector('.titleFee'));
  const plateFee = getNum(card.querySelector('.plateFee'));
  const totalFees = docFee + regFee + titleFee + plateFee;
  
  // Calculate loan
  const loanAmount = sellingPrice - downPayment;
  const monthlyRate = apr / 12;
  
  let monthlyPayment = 0;
  if (monthlyRate > 0) {
    const factor = Math.pow(1 + monthlyRate, financeTermMonths);
    monthlyPayment = (loanAmount * monthlyRate * factor) / (factor - 1);
  } else {
    monthlyPayment = loanAmount / financeTermMonths;
  }
  
  const totalPayments = monthlyPayment * financeTermMonths;
  const totalInterest = totalPayments - loanAmount;
  
  // Sales tax
  const salesTax = sellingPrice * taxRate;
  
  // Total cost
  const totalCost = downPayment + totalPayments + salesTax + totalFees;
  
  // Cost per mile
  const totalMiles = annualMiles * (financeTermMonths / 12);
  const costPerMile = totalMiles > 0 ? totalCost / totalMiles : 0;
  
  // Amortization schedule
  const financeSchedule = generateAmortizationSchedule(
    loanAmount,
    financeTermMonths,
    apr,
    0  // No balloon for standard finance
  );
  
  return {
    loanAmount,
    monthlyPayment,
    totalInterest,
    totalPayments,
    totalCost,
    costPerMile,
    schedule: financeSchedule,
    dueAtSigning: downPayment + docFee + regFee + titleFee,
    apr: apr * 100,
    termMonths: financeTermMonths
  };
}

    // DERIVED METRICS
    derived: {

        : 0,

    },
    
    // Raw metrics for comparison (what gets normalized)
    metrics: {
      monthly: scenarioObject.metrics.monthly,
      totalCost: scenarioObject.metrics.totalCost,
      costPerMile: scenarioObject.metrics.costPerMile
    }
  };
}

function getResidual(term, mileage, condition = 'new') {
    const matrix = RESIDUAL_MATRIX[condition] || RESIDUAL_MATRIX.new;
    const termStr = term.toString();
    const mileageStr = mileage.toString();
    
    if (matrix.DEFAULT && matrix.DEFAULT[termStr] && matrix.DEFAULT[termStr][mileageStr]) {
        return matrix.DEFAULT[termStr][mileageStr] / 100;
    }
    return 0.50;
}

function getResidualPercentage(brand, term, mileage, condition = "new") {
    if (!brand || !term || !mileage) return null;
    
    // Ensure RESIDUAL_MATRIX exists (loaded from the other file)
    if (typeof RESIDUAL_MATRIX === 'undefined') {
        console.error("CRITICAL: residual_matrix.js not loaded!");
        return 50; 
    }

    const termKey = String(term);
    const mileageKey = String(mileage);

    try {
        if (RESIDUAL_MATRIX[condition] &&
            RESIDUAL_MATRIX[condition][brand] &&
            RESIDUAL_MATRIX[condition][brand][termKey] &&
            RESIDUAL_MATRIX[condition][brand][termKey][mileageKey]) {
            return RESIDUAL_MATRIX[condition][brand][termKey][mileageKey];
        }
    } catch (e) {
        console.warn("Lookup failed for", brand, term, mileage);
    }
    return 50; // Fallback
}

function buildScenariosWithIncentives(card, vehicleIndex, allIncentives, userLocation) {
  const scenarios = buildAllScenariosForCard(card, vehicleIndex);
  const make = card.querySelector('. make')?.value;
  const dealerLocation = getDealerLocation(card); // Extract from dealer fields
  
  // Get incentives applicable to this vehicle
  const dealParams = {
    dealType: 'lease', // Would vary by scenario type
    termMonths: parseInt(card.querySelector('.leaseTerm').value),
    downPayment: getNum(card.querySelector('.downPayment')),
    annualMiles: parseInt(card.querySelector('.annualMileage').value)
  };
  
  const applicableIncentives = getApplicableIncentives(allIncentives, {
    userLocation,
    dealerLocation,
    dealParams,
    types: null // No type filter - get all
  });
  
  // Apply to each scenario
  return scenarios.map(scenario => {
    // Filter incentives by scenario deal type
    const scenarioIncentives = applicableIncentives.applicable. filter(inc => 
      inc.dealTypes.includes(scenario.scenario)
    );
    
    if (scenarioIncentives.length === 0) {
      return { ...scenario, applicableIncentives: [], incentiveValue: 0 };
    }
    
    // Calculate incentive impact
    const incentiveCalc = calculateIncentiveValue(scenarioIncentives, {
      sellingPrice: getNum(card.querySelector('.sellingPrice')),
      downPayment: dealParams.downPayment,
      monthlyPayment: scenario.metrics.monthly,
      apr: getNum(card.querySelector('.apr')) / 100,
      moneyFactor: getNum(card.querySelector('.moneyFactor')),
      capCost: getNum(card.querySelector('.capAmount')),
      residual: getNum(card.querySelector('.residualValue')),
      leaseTermMonths: leaseTerm,
      financeTermMonths: leaseTerm,
      loanAmount: getNum(card. querySelector('.sellingPrice')) - dealParams.downPayment
    });
    
    // Adjust scenario metrics by incentive value
    const adjustedMonthly = Math.max(0, scenario.metrics.monthly - (incentiveCalc.totalValue / scenario.termMonths));
    const adjustedTotal = scenario.metrics.totalCost - incentiveCalc.totalValue;
    
    return {
      ... scenario,
      applicableIncentives: scenarioIncentives,
      incentiveValue: incentiveCalc.totalValue,
      originalMetrics: { ...scenario.metrics },
      metrics: {
        monthly: adjustedMonthly,
        totalCost: adjustedTotal,
        costPerMile: adjustedTotal / scenario. metrics.totalMiles,
        dueAtSigning: Math.max(0, scenario.metrics. dueAtSigning - incentiveCalc.totalValue)
      },
      incentiveBreakdown: incentiveCalc.breakdown
    };
  });
}

function exportComparisonData() {
  const cards = document.querySelectorAll('.vehicle-card');
  const outputs = [];
  
  cards.forEach(card => {
    const selectedScenarioId = card.dataset.selectedScenarioId;
    if (!selectedScenarioId) return;
    
    const output = buildComparisonOutput(card, selectedScenarioId);
    if (output) outputs.push(output);
  });
  
  const weights = getCurrentWeights();
  const scored = normalizeAndScore(outputs, weights);
  scored.sort((a, b) => b.weightedScore - a.weightedScore);
  
  return {
    timestamp: new Date().toISOString(),
    weights,
    scenarios: scored,
    detailedTable: buildDetailedComparisonTable(outputs)
  };
}

function exportToCSV() {
  const cards = document.querySelectorAll('.vehicle-card');
  const outputs = [];
  
  cards.forEach(card => {
    const selectedScenarioId = card.dataset.selectedScenarioId;
    if (!selectedScenarioId) return;
    
    const output = buildComparisonOutput(card, selectedScenarioId);
    if (output) outputs.push(output);
  });
  
  if (outputs.length === 0) {
    showToast('No scenarios to export', 'error');
    return;
  }
  
  // Build CSV header
  let csv = 'Parameter,' + outputs.map(o => o.vehicleInfo.displayName).join(',') + '\n';
  
  // Add rows
  const rowLabels = [
    { key: 'msrp', label: 'MSRP' },
    { key: 'capAmount', label: 'Cap Cost' },
    { key: 'downPayment', label: 'Down Payment' },
    { key: 'leaseTerm', label: 'Term (months)' },
    { key: 'monthly', label: 'Monthly Payment', calc: true },
    { key: 'totalCost', label: 'Total Cost', calc: true },
    { key: 'costPerMile', label: 'Cost Per Mile', calc: true }
  ];
  
  rowLabels.forEach(row => {
    let values = [row.label];
    outputs.forEach(out => {
      if (row.calc) {
        values.push(out.calculations[row.key] || 0);
      } else {
        values.push(out.inputs[row.key] || 0);
      }
    });
    csv += values.join(',') + '\n';
  });
  
  // Trigger download
  const blob = new Blob([csv], { type: 'text/csv' });

  const a = document.createElement('a');

  a.download = `comparison-${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a);

function makeFromVin(v) {
  v = String(v || '').toUpperCase();
  for(let i = 6; i >= 3; i--) {
    const prefix = v.slice(0, i);
    if(VIN[prefix]) return VIN[prefix];
  }
  return '';
}

function yearFromVin(v) {
  v = String(v || '').toUpperCase();
  if(v.length >= 10) {
    const yearChar = v.charAt(9);
    return VIN_YEAR[yearChar] || '';
  }
  return '';
}

function calculateAgeFromVin(v) {
  const year = yearFromVin(v);
  if(!year) return 0;
  const currentYear = new Date().getFullYear();
  let age = currentYear - year;
  return Math.min(age, 7);
}

function stateFromZip(z) {
  const zipStr = String(z).padStart(5, '0');
  if(zipStr.length !== 5) return '';
  for(const [lo, hi, st] of ZIP_RANGES) {
    if(zipStr >= lo && zipStr <= hi) return st;
  }
  return '';
}

async function handleZipInput(vehicleNum, card) {
  const zipEl = card.querySelector('.zip');
  if(!zipEl) return;
  const zip = zipEl.value.trim();
  
  if(zip.length === 5) {
    try {
      const resp = await fetch(`https://api.zippopotam.us/us/${zip}`);
      if(!resp.ok) throw new Error('ZIP not found');
      const data = await resp.json();
      
      const stateCode = data.places[0]['state abbreviation'];
      const stateDisplayEl = card.querySelector('.stateDisplay');
      if(stateDisplayEl) {
        const stateInfo = STATES.find(s => s.code === stateCode);
        if(stateInfo) stateDisplayEl.value = `${stateInfo.name} (${stateCode})`;
      }
      
      const cityEl = card.querySelector('.city');
      if(cityEl) cityEl.value = data.places[0]['place name'];
      
      const latitude = data.places[0].latitude;
      const longitude = data.places[0].longitude;
      const countyEl = card.querySelector('.county');
      if(countyEl) {
        try {
          const fccResp = await fetch(`https://geo.fcc.gov/api/census/block/find?format=json&latitude=${latitude}&longitude=${longitude}`);
          if(fccResp.ok) {
            const fccData = await fccResp.json();
            if(fccData && fccData.County) countyEl.value = fccData.County.name;
          }
        } catch(e) {
          countyEl.value = '';
        }
      }

      updateRegistrationFees(vehicleNum, card, stateCode);
      updateEVCredits(vehicleNum, card, stateCode);
    } catch(error) {
      card.querySelector('.stateDisplay').value = '';
      card.querySelector('.city').value = '';
      card.querySelector('.county').value = '';
    }
  }
}

async function handleVinInput(vehicleNum, card) {
  const vinEl = card.querySelector('.vin');
  if(!vinEl) return;
  const vin = vinEl.value.trim();
  
  const age = calculateAgeFromVin(vin);
  const ageEl = card.querySelector('.vehicleAge');
  if(ageEl) ageEl.value = age;
  
  if(vin.length >= 3) {
    const make = makeFromVin(vin);
    const makeEl = card.querySelector('.make');
    if(make && makeEl) {
      makeEl.value = make;
      updateMakeFees(vehicleNum, card);
    }
  }
  
  if(vin.length === 17) {
    const yearEl = card.querySelector('.year');
    const modelEl = card.querySelector('.model');
    const year = yearFromVin(vin);
    if(year && yearEl) yearEl.value = year;
    
    try {
      const response = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/decodevin/${vin}?format=json`);
      const data = await response.json();
      if(data.Results && Array.isArray(data.Results)) {
        data.Results.forEach(item => {
          if(item.Variable === 'Model' && item.Value && modelEl) modelEl.value = item.Value;
        });
      }
    } catch(error) {
      // silently fail
    }
  }
  
  updateResidualValue(vehicleNum, card);
}

function updateMakeFees(vehicleNum, card) {

function updateRegistrationFees(vehicleNum, card, stateCode) {
  const regEl = card.querySelector('.regFee');
  const titleEl = card.querySelector('.titleFee');
  const plateEl = card.querySelector('.plateFee');
  
  if(!stateCode) return;
  const fees = STATE_VEHICLE_FEES[stateCode];
  const vehicleAge = parseInt(card.querySelector('.vehicleAge')?.value) || 0;
  
  if(fees) {
    if(titleEl) titleEl.value = fees.titleFee || 0;
    if(plateEl) plateEl.value = fees.plateFee || 0;
    if(regEl) {
      if(fees.feeType === 'declining' && fees.depreciationSchedule) {
        const depPct = fees.depreciationSchedule[vehicleAge] || 1.0;
        regEl.value = Math.round(((fees.baseFee || 0) + (fees.technologySurcharge || 0) + (fees.registrationAnnual || 0)) * depPct * 100) / 100;
      } else {
        regEl.value = fees.registrationAnnual || 0;
      }
    }
  }
}

  const term = card.querySelector('.term')?.value || '36';

  if(condition === 'used') matrix = RESIDUAL_MATRIX_USED;
  
  const termData = matrix[term];
  if(termData && termData[mileage]) {

    card.querySelector('.residual').value = residPct;
  }

function calculateMoneyFactor(vehicleNum, card) {
  const mfEl = card.querySelector('.moneyFactor');
  const aprEl = card.querySelector('.apr');
  const creditTierEl = card.querySelector('.creditTier');
  
  if(!mfEl) return 0.00125;
  
  const currentMF = num(mfEl.value);
  if(currentMF > 0) return currentMF;
  
  if(aprEl && num(aprEl.value) > 0) {
    const apr = num(aprEl.value);
    const calculatedMF = apr / 2400;
    mfEl.value = calculatedMF.toFixed(5);
    return calculatedMF;
  }
  
  if(creditTierEl && creditTierEl.value && creditTierEl.value !== '') {
    const tier = creditTierEl.value;
    const estimatedMF = CREDIT_TIER_MF[tier] || 0.00150;
    mfEl.value = estimatedMF.toFixed(5);
    return estimatedMF;
  }
  
  return 0.00125;
}

function calculateStateFees(vehicleNum, card, msrp, vehicleAge, altFuelType) {
  const zip = card.querySelector('.zip')?.value;
  if(!zip) return {oneTimeFees: 0, annualFees: 0, lateFees: 0};
  
  const stateCode = stateFromZip(zip);
  if(!stateCode) return {oneTimeFees: 0, annualFees: 0, lateFees: 0};
  
  const fees = STATE_VEHICLE_FEES[stateCode];
  if(!fees) return {oneTimeFees: 0, annualFees: 0, lateFees: 0};
  
  let oneTimeFees = 0;
  let annualFees = 0;
  let lateFees = 0;
  
  const ageCapped = Math.min(vehicleAge, 7);
  
  switch(fees.feeType) {
    case "declining":
      let depreciationPct = 1.0;
      if(fees.depreciationSchedule) {
        depreciationPct = fees.depreciationSchedule[ageCapped] || 1.0;
      }
      let registrationTax = 0;
      if(fees.adValoremRateNew) {
        registrationTax = msrp * depreciationPct * fees.adValoremRateNew;
      }
      annualFees = (fees.baseFee || 0) + (fees.technologySurcharge || 0) + registrationTax;
      if(fees.evSurchargeAnnual && altFuelType.includes('ev')) annualFees += fees.evSurchargeAnnual;
      else if(fees.phevSurchargeAnnual && altFuelType.includes('phev')) annualFees += fees.phevSurchargeAnnual;
      oneTimeFees += (fees.titleFee || 0) + (fees.plateFee || 0) + (fees.transferFee || 0);
      break;
    case "one-time":
      oneTimeFees += msrp * (fees.tavtOneTimePct || 0) + (fees.titleFee || 0) + (fees.plateFee || 0);
      annualFees += (fees.registrationAnnual || 0);
      if(fees.evSurchargeAnnual && altFuelType.includes('ev')) annualFees += fees.evSurchargeAnnual;
      else if(fees.phevSurchargeAnnual && altFuelType.includes('phev')) annualFees += fees.phevSurchargeAnnual;
      break;
    case "flat":
    default:
      oneTimeFees += (fees.titleFee || 0) + (fees.plateFee || 0);
      annualFees += (fees.registrationAnnual || 0);
      if(fees.evSurchargeAnnual && altFuelType.includes('ev')) annualFees += fees.evSurchargeAnnual;
      else if(fees.phevSurchargeAnnual && altFuelType.includes('phev')) annualFees += fees.phevSurchargeAnnual;
      break;
  }
  
  lateFees = Math.max(fees.lateFeeFlat || 0, (oneTimeFees + annualFees) * (fees.lateFeePercent || 0));
  
  return {oneTimeFees, annualFees, lateFees};
}

function calculateEvCredits(vehicleNum, card) {
  const phevChecked = card.querySelector('.fuelTypePHEV')?.checked;
  const evChecked = card.querySelector('.fuelTypeEV')?.checked;
  let altFuelType = [];
  if(phevChecked) altFuelType.push('phev');
  if(evChecked) altFuelType.push('ev');
  
  const condition = card.querySelector('.condition')?.value || 'new';
  const msrp = num(card.querySelector('.msrp')?.value);
  const zip = card.querySelector('.zip')?.value;
  const stateCode = stateFromZip(zip);
  
  let credits = {fedNew: 0, stateNew: 0, fedUsed: 0, stateUsed: 0};
  
  const fedNewEl = card.querySelector('.fedNewCredit')?.value || 'auto';
  const stateNewEl = card.querySelector('.stateNewCredit')?.value || 'auto';
  const fedUsedEl = card.querySelector('.fedUsedCredit')?.value || 'auto';
  const stateUsedEl = card.querySelector('.stateUsedCredit')?.value || 'auto';
  
  if(altFuelType.length && (condition === 'new' || condition === 'cpo')) {
    if((fedNewEl === 'yes') || (fedNewEl === 'auto' && msrp <= 80000)) {
      credits.fedNew = (altFuelType.includes('ev')) ? 7500 : 4000;
    }
    
    if((stateNewEl === 'yes') || (stateNewEl === 'auto' && stateCode && STATE_EV_CREDITS[stateCode])) {
      credits.stateNew = STATE_EV_CREDITS[stateCode]?.new || 0;
    }
  }
  
  if(altFuelType.length && condition === 'used') {
    if((fedUsedEl === 'yes') || (fedUsedEl === 'auto')) {
      credits.fedUsed = 4000;
    }
    
    if((stateUsedEl === 'yes') || (stateUsedEl === 'auto' && stateCode && STATE_EV_CREDITS[stateCode])) {
      credits.stateUsed = STATE_EV_CREDITS[stateCode]?.used || 0;
    }
  }
  
  return credits;
}

  if(vinInput) {
    vinInput.addEventListener('blur', () => handleVinInput(vehicleNum, card));
  }
  
  if(zipInput) {
    zipInput.addEventListener('blur', () => handleZipInput(vehicleNum, card));
  }
  
  if(makeSelect) {
    makeSelect.addEventListener('change', () => updateMakeFees(vehicleNum, card));
  }
  
  if(conditionSelect) {
    conditionSelect.addEventListener('change', () => {
      updateDealArrangement(vehicleNum, card);
      updateResidualValue(vehicleNum, card);
    });
  }
  
  if(dealTypeSelect) {
    dealTypeSelect.addEventListener('change', () => {
      updateDealArrangement(vehicleNum, card);
      updateResidualValue(vehicleNum, card);
    });
  }
  
  if(termSelect || mileageSelect) {
    const updateResidual = () => updateResidualValue(vehicleNum, card);
    if(termSelect) termSelect.addEventListener('change', updateResidual);
    if(mileageSelect) mileageSelect.addEventListener('change', updateResidual);
  }
  
  const aprInput = card.querySelector('.apr');
  const mfInput = card.querySelector('.moneyFactor');
  
  if(aprInput) handleAprInput(vehicleNum, card);
  if(mfInput) handleMfInput(vehicleNum, card);
  
  handleMsdToggle(vehicleNum, card);
  handleZeroDriveOffSlider(vehicleNum, card);
}

async function fetchJSON(url) {
    const response = await fetch(url);
    return response.json();
}

async function preloadIncentiveData() {
    try {
        // Load federal credits
        const xmlResponse = await fetch('https://www.fueleconomy.gov/ws/rest/vehicles/taxcredit?format=json');
        const xmlText = await xmlResponse.text();
        const xmlData = xml2json(xmlText);
        
        if (xmlData.vehicles && xmlData.vehicles.vehicle) {
            FED_CREDITS = xmlData.vehicles.vehicle.map(v => ({
                make: v.make,
                model: v.model,
                year: parseInt(v.year),
                amount: parseInt(v.credit)
            }));
        }

        // Load state credits
        STATE_CREDITS = await fetchJSON('https://evincentive.kbb.com/api/state/summary');
    } catch (error) {
        console.warn('Failed to load live incentive data:', error);
        // Use fallback static data
        FED_CREDITS = [];
        STATE_CREDITS = EV_INCENTIVES.state;
    }
}

function updateFees(suffix) {
    const makeEl = document.getElementById(`make${suffix}`);
    const acqEl = document.getElementById(`acq${suffix}`);
    const dispEl = document.getElementById(`disp${suffix}`);
    
    if (makeEl && acqEl && dispEl) {
        const make = makeEl.value;
        if (FEES[make]) {
            acqEl.value = FEES[make].acq;
            dispEl.value = FEES[make].disp;
        }
    }
}

function updateCapCost(suffix) {
    const msrpEl = document.getElementById(`msrp${suffix}`);
    const sellEl = document.getElementById(`sellingPrice${suffix}`);
    const capEl = document.getElementById(`capCost${suffix}`);
    
    if (msrpEl && sellEl && capEl) {
        const msrp = parseFloat(msrpEl.value) || 0;
        const sell = parseFloat(sellEl.value) || 0;
        if (msrp > 0) {
            capEl.value = ((sell / msrp) * 100).toFixed(2);
        }
    }
}

function updateResidual(suffix) {
    const termEl = document.getElementById(`term${suffix}`);
    const mileEl = document.getElementById(`mileage${suffix}`);
    const resEl = document.getElementById(`residual${suffix}`);
    
    if (termEl && mileEl && resEl) {
        const term = termEl.value;
        const mile = mileEl.value;
        if (RESIDUAL_MATRIX[term] && RESIDUAL_MATRIX[term][mile]) {
            resEl.value = RESIDUAL_MATRIX[term][mile];
        }
    }
}

function updateTax(suffix) {
    const stateEl = document.getElementById(`state${suffix}`);
    const taxEl = document.getElementById(`taxRate${suffix}`);
    
    if (stateEl && taxEl) {
        const stateCode = stateEl.value;
        const state = STATES.find(s => s.code === stateCode);
        if (state) {
            taxEl.value = state.tax;
        }
    }
}

function initDropdowns() {
    // Initialize make dropdowns
    const makeSelects = [document.getElementById('makeA'), document.getElementById('makeB')];
    makeSelects.forEach(select => {
        if (select) {
            MAKES.forEach(make => {
                const option = document.createElement('option');
                option.value = make;
                option.textContent = make;
                select.appendChild(option);
            });
        }
    });
    
    // Initialize state dropdowns
    const stateSelects = [document.getElementById('stateA'), document.getElementById('stateB')];
    stateSelects.forEach(select => {
        if (select) {
            STATES.forEach(state => {
                const option = document.createElement('option');
                option.value = state.code;
                option.textContent = state.name;
                select.appendChild(option);
            });
        }
    });
}

function attachListeners() {
    ['A', 'B'].forEach(suffix => {
        // MSRP and selling price listeners
        const msrpEl = document.getElementById(`msrp${suffix}`);
        const sellEl = document.getElementById(`sellingPrice${suffix}`);
        if (msrpEl) msrpEl.addEventListener('input', () => updateCapCost(suffix));
        if (sellEl) sellEl.addEventListener('input', () => updateCapCost(suffix));
        
        // Term and mileage listeners
        const termEl = document.getElementById(`term${suffix}`);
        const mileEl = document.getElementById(`mileage${suffix}`);
        if (termEl) termEl.addEventListener('change', () => updateResidual(suffix));
        if (mileEl) mileEl.addEventListener('change', () => updateResidual(suffix));
        
        // Make listener
        const makeEl = document.getElementById(`make${suffix}`);
        if (makeEl) makeEl.addEventListener('change', () => {
            updateFees(suffix);
            updateEVCredits(suffix);
        });
        
        // Model and year listeners
        const modelEl = document.getElementById(`model${suffix}`);
        const yearEl = document.getElementById(`year${suffix}`);
        if (modelEl) modelEl.addEventListener('change', () => updateEVCredits(suffix));
        if (yearEl) yearEl.addEventListener('change', () => updateEVCredits(suffix));
        
        // State listener
        const stateEl = document.getElementById(`state${suffix}`);
        if (stateEl) stateEl.addEventListener('change', () => {
            updateTax(suffix);
            updateEVCredits(suffix);
        });
        
        // ZIP code listener
        const zipEl = document.getElementById(`zip${suffix}`);
        if (zipEl) zipEl.addEventListener('blur', async (e) => {
            const zip = e.target.value;
            if (zip.length === 5) {
                try {
                    const stateCode = ZIP_TO_STATE.lookup(zip);
                    if (stateCode) {
                        const stateEl = document.getElementById(`state${suffix}`);
                        if (stateEl) {
                            stateEl.value = stateCode;
                            updateTax(suffix);
                            updateEVCredits(suffix);
                        }
                    }
                } catch (error) {
                    console.warn('ZIP lookup failed:', error);
                }
            }
        });
        
        // VIN listener
        const vinEl = document.getElementById(`vin${suffix}`);
        if (vinEl) vinEl.addEventListener('blur', (e) => decodeVIN(e.target.value, suffix));
    });
}

function getEpaVehicleSpec(make, model) {
    if (!EPA_EV_DATABASE || !Array.isArray(EPA_EV_DATABASE.vehicles)) return null;
    const m = (make || '').toLowerCase();
    const mdl = (model || '').toLowerCase();
    return EPA_EV_DATABASE.vehicles.find(v =>
        v.make.toLowerCase() === m && v.model.toLowerCase() === mdl
    ) || null;
}

function getEpaVehiclesByType(type) {
    const t = (type || '').toUpperCase();
    const list = EPA_EV_DATABASE?.vehicles || [];
    return list.filter(v => (v.vehicleType || '').toUpperCase() === t);
}

    function getMakeFromVIN(vin){if(vin.length<3)return null;const prefix=vin.substring(0,3);return VIN[prefix]||null;}

function resolveModelYear(code) {
  if (!baseModelYearMap.hasOwnProperty(code)) {
    console.warn(`Unknown model year code: ${code}`);
    return null;
  }
  const year = baseModelYearMap[code];
  // Add 30-year cycle if needed for post-2009
  const currentYear = new Date().getFullYear();
  return year + (year + 30 <= currentYear ? 30 : 0);
}

function getElement(selector) {
  const el = document.querySelector(selector);
  if (!el) console.warn(`Element not found: ${selector}`);
  return el;
}

function updateMappings() {
  const vin = getElement('#vin').value.trim().toUpperCase();
  if (vin.length >= 2) {
    // Country region
    const region = countryRegions[vin.charAt(0)] || 'Unknown';
    getElement('#region').textContent = region;
    // Country by first two chars
    const country = vinCountries[vin.substring(0, 2)] || 'Unknown';
    getElement('#country').textContent = country;
    // Model year
    const my = resolveModelYear(vin.charAt(9));
    getElement('#modelYear').textContent = my || 'Unknown';
  }

  // State-based fees & incentives
  const state = getElement('#state').value;
  const fees = stateFees[state] || {};
  const inc = incentivesByState[state] || {};
  getElement('#docFee').textContent = fees.docFee || 'N/A';
  getElement('#tagFee').textContent = fees.tagFee || 'N/A';
  getElement('#titleFee').textContent = fees.titleFee || 'N/A';
  getElement('#evCredit').textContent = inc.evCredit != null ? `$${inc.evCredit}` : 'N/A';
}

function initEventListeners() {
  const vinInput = getElement('#vin');
  if (vinInput) vinInput.addEventListener('input', updateMappings);

  const stateSelect = getElement('#state');
  if (stateSelect) stateSelect.addEventListener('change', updateMappings);

  // Recompute on page load
  document.addEventListener('DOMContentLoaded', updateMappings);
}
