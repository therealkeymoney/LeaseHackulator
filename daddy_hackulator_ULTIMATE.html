                function fmt(val) {
                  if (val === null || val === undefined || isNaN(val)) return '$0.00';
                  return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }

                function fmtPct(val) {
                  if (val === null || val === undefined || isNaN(val)) return '0.00%';
                  return Number(val).toFixed(2) + '%';
                }

                async function lookupZip(zip, card) {
                  if (!zip || zip.length !== 5) return;

                  try {
                    const resp = await fetch(`http://api.positionstack.com/v1/forward?access_key=${POSITIONSTACK_API_KEY}&query=${zip}`);
                    const data = await resp.json();

                    if (data.data && data.data.length > 0) {
                      const loc = data.data[0];
                      card.querySelector('.city').value = loc.locality || '';
                      card.querySelector('.state').value = loc.region_code || '';
                      card.querySelector('.county').value = loc.county || '';
                    }
                  } catch (err) {
                    console.error('Zip lookup failed:', err);
                  }
                }

                function setFuelType(card, type) {
                  const fuelLower = type.toLowerCase();
                  let detectedType = 'gas';

                  if (fuelLower.includes('electric') || fuelLower.includes('ev')) {
                    detectedType = 'ev';
                  } else if (fuelLower.includes('plug-in') || fuelLower.includes('phev')) {
                    detectedType = 'phev';
                  }

                  card.querySelector('.fuelType').value = detectedType;
                  card.querySelector('.fuelTypeDisplay').value = detectedType.toUpperCase();

                  card.querySelectorAll('.gas-field').forEach(el => el.classList.toggle('hidden', detectedType !== 'gas'));
                  card.querySelectorAll('.ev-field').forEach(el => el.classList.toggle('hidden', detectedType !== 'ev'));
                  card.querySelectorAll('.phev-field').forEach(el => el.classList.toggle('hidden', detectedType !== 'phev'));
                  card.querySelectorAll('[data-ev-only]').forEach(el => el.parentElement.classList.toggle('ev-field-hidden', detectedType === 'gas'));
                }

                function calculateFuelCosts(card) {
                  const fuelType = card.querySelector('.fuelType').value;
                  const annualMiles = parseFloat(card.querySelector('.annualMileage').value) || 12000;

                  if (fuelType === 'gas') {
                    const combMPG = parseFloat(card.querySelector('.epaCombinedMpg').value) || 25;
                    const gasPrice = parseFloat(card.querySelector('.avgGasPrice').value) || 2.65;
                    const tankSize = parseFloat(card.querySelector('.fuelTankSize').value) || 0;
                    const rangeGas = combMPG * tankSize;

                    card.querySelector('.rangeGas').value = rangeGas.toFixed(0);

                    const annualCost = (annualMiles / combMPG) * gasPrice;
                    card.querySelector('.annualFuelCost').value = annualCost.toFixed(2);
                  } else if (fuelType === 'ev') {
                    const combMPGe = parseFloat(card.querySelector('.mpgeCombined').value) || 100;
                    const l2Cost = parseFloat(card.querySelector('.l2electricityCost').value) || 0.1855;
                    const l3Cost = parseFloat(card.querySelector('.l3electricityCost').value) || 0.4555;

                    const kWhPer100Mi = 33.7 / combMPGe * 100;
                    const annualKWh = (annualMiles / 100) * kWhPer100Mi;

                    card.querySelector('.annualChargingCostL2').value = (annualKWh * l2Cost).toFixed(2);
                    card.querySelector('.annualChargingCostL3').value = (annualKWh * l3Cost).toFixed(2);
                  } else if (fuelType === 'phev') {
                    const electricPct = parseFloat(card.querySelector('.phevElectricPct').value) || 60;
                    const combMPGe = parseFloat(card.querySelector('.mpgeCombined').value) || 80;
                    const combMPG = parseFloat(card.querySelector('.epaCombinedMpg').value) || 35;
                    const gasPrice = parseFloat(card.querySelector('.avgGasPrice').value) || 2.65;
                    const l2Cost = parseFloat(card.querySelector('.l2electricityCost').value) || 0.1855;

                    const electricMiles = annualMiles * (electricPct / 100);
                    const gasMiles = annualMiles - electricMiles;

                    const kWhPer100Mi = 33.7 / combMPGe * 100;
                    const electricKWh = (electricMiles / 100) * kWhPer100Mi;

                    card.querySelector('.annualFuelCostPHEV').value = ((gasMiles / combMPG) * gasPrice).toFixed(2);
                    card.querySelector('.annualChargingCostPHEV').value = (electricKWh * l2Cost).toFixed(2);
                  }
                }

                function addVehicle() {
                  vehicleCounter++;
                  const template = document.getElementById('vehicleCardTemplate');
                  const clone = template.content.cloneNode(true);
                  const card = clone.querySelector('.vehicle-card');

                  card.dataset.vehicleId = vehicleCounter;
                  card.querySelector('.v-num').textContent = vehicleCounter;

                  const scenarioSelect = card.querySelector('.scenarioSelect');
                  SCENARIOS.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.name;
                    scenarioSelect.appendChild(opt);
                  });

                  card.querySelector('.vin').addEventListener('blur', (e) => decodeVIN(e.target.value, card));
                  card.querySelector('.zip').addEventListener('blur', (e) => lookupZip(e.target.value, card));
                  card.querySelector('.vehicleCondition').addEventListener('change', (e) => {
                    const isCPOUsed = e.target.value !== 'new';
                    card.querySelectorAll('.cpo-used-fields').forEach(el => el.classList.toggle('hidden', !isCPOUsed));
                  });

                  card.querySelector('.msdActive').addEventListener('change', (e) => {
                    card.querySelectorAll('.msd-field').forEach(el => el.classList.toggle('hidden', !e.target.checked));
                  });

                  card.querySelector('.tradeScenario').addEventListener('change', (e) => {
                    card.querySelectorAll('.check-back-field').forEach(el => el.classList.toggle('hidden', e.target.value !== 'checkback'));
                  });

                  card.querySelector('.dealType').addEventListener('change', (e) => {
                    const isBalloon = e.target.value === 'balloon';
                    card.querySelectorAll('.balloon-fields').forEach(el => el.classList.toggle('hidden', !isBalloon));
                  });

                  ['epaCombinedMpg', 'avgGasPrice', 'annualMileage', 'mpgeCombined', 'l2electricityCost', 'l3electricityCost'].forEach(cls => {
                    const input = card.querySelector(`.${cls}`);
                    if (input) input.addEventListener('input', () => calculateFuelCosts(card));
                  });

                  card.querySelector('.scenarioSelect').addEventListener('change', (e) => {
                    const scenario = SCENARIOS.find(s => s.id === e.target.value);
                    if (scenario) {
                      card.querySelector('.scenario-details').classList.remove('hidden');
                      const infoDiv = card.querySelector('.scenario-info');
                      infoDiv.innerHTML = `<p><strong>${scenario.name}</strong></p><p>${scenario.description}</p>`;
                      card.dataset.selectedScenario = JSON.stringify(scenario.params);
                    } else {
                      card.querySelector('.scenario-details').classList.add('hidden');
                    }
                  });

                  document.getElementById('vehiclesContainer').appendChild(clone);
                  vehicles.push({ id: vehicleCounter, card });
                  updateVehicleCount();
                }

                function clearVehicle(btn) {
                  const card = btn.closest('.vehicle-card');
                  card.querySelectorAll('input[type="number"], input[type="text"]').forEach(inp => {
                    if (!inp.readOnly) inp.value = '';

                  showToast('Vehicle cleared');

                function removeVehicle(btn) {
                  const card = btn.closest('.vehicle-card');
                  const id = parseInt(card.dataset.vehicleId);
                  const idx = vehicles.findIndex(v => v.id === id);
                  if (idx > -1) vehicles.splice(idx, 1);
                  card.remove();
                  updateVehicleCount();
                  showToast('Vehicle removed');
                }

                }

                function applyScenario(btn) {
                  const card = btn.closest('.vehicle-card');
                  const params = JSON.parse(card.dataset.selectedScenario || '{}');

                  Object.keys(params).forEach(key => {
                    const input = card.querySelector(`.${key}`);
                    if (input) {
                      if (input.type === 'checkbox') {
                        input.checked = params[key];
                        input.dispatchEvent(new Event('change'));

                                function calculateDistance(zipCode, dealerLat, dealerLon, card) {
                                  fetch(`https://api.zippopotam.us/us/${zipCode}`)
                                    .then(response => response.json())
                                    .then(data => {
                                      if (data.places && data.places.length > 0) {
                                        var userLat = parseFloat(data.places[0].latitude);
                                        var userLon = parseFloat(data.places[0].longitude);

                                        var distance = getDistanceFromLatLonInMiles(userLat, userLon, dealerLat, dealerLon);

                                        console.log(`Distance: ${distance.toFixed(1)} miles`);
                                        setFieldValue(card, '.dealerDistance', `${distance.toFixed(1)} mi`);
                                      }
                                    })
                                    .catch(err => console.error('Distance calculation failed:', err));
                                }

                                function getDistanceFromLatLonInMiles(lat1, lon1, lat2, lon2) {
                                  var dLat = deg2rad(lat2 - lat1);
                                  var dLon = deg2rad(lon2 - lon1);
                                  var a =
                                    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                                    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                                  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                                  return R * c;
                                }

                                function deg2rad(deg) {
                                  return deg * (Math.PI / 180);
                                }

                                  function calculateGasFuelCost(card) {
                                  var annualMileage = parseFloat(card.querySelector('.annualMileage')?.value || 18000);
                                  var combinedMPG = parseFloat(card.querySelector('.epaCombinedMpg')?.value || 0);
                                  var fuelCost = parseFloat(card.querySelector('.fuelCostPerGallon')?.value || 2.65);

                                  if (combinedMPG > 0) {
                                    var costPer100Mi = (100 / combinedMPG) * fuelCost;
                                    var annualCost = (annualMileage / combinedMPG) * fuelCost;

                                    setFieldValue(card, '.fuelCostPer100Mi', costPer100Mi.toFixed(2));
                                    setFieldValue(card, '.annualFuelCost', Math.round(annualCost));
                                  }
                                }

                                function calculateEVEnergyCost(card) {
                                  var annualMileage = parseFloat(card.querySelector('.annualMileage')?.value || 18000);
                                  var combinedMPGe = parseFloat(card.querySelector('.mpgeCombined')?.value || 0);
                                  var l2Rate = parseFloat(card.querySelector('.l2ChargingRate')?.value || 0.1855);
                                  var l3Rate = parseFloat(card.querySelector('.l3ChargingRate')?.value || 0.4555);

                                  if (combinedMPGe > 0) {
                                    var kWhPer100Mi = 23.7 / combinedMPGe * 100;
                                    var annualCostL2 = (annualMileage / 100) * kWhPer100Mi * l2Rate;
                                    var annualCostL3 = (annualMileage / 100) * kWhPer100Mi * l3Rate;

                                    setFieldValue(card, '.kwhPer100Mi', kWhPer100Mi.toFixed(2));
                                    setFieldValue(card, '.annualEnergyCostL2', Math.round(annualCostL2));
                                    setFieldValue(card, '.annualEnergyCostL3', Math.round(annualCostL3));
                                  }
                                }

                                function calculatePHEVEnergyCost(card) {
                                  var annualMileage = parseFloat(card.querySelector('.annualMileage')?.value || 18000);
                                  var electricRange = parseFloat(card.querySelector('.electricRange')?.value || 0);
                                  var totalRange = parseFloat(card.querySelector('.totalRange')?.value || 0);

                                  if (totalRange > 0) {
                                    var electricPercent = electricRange / totalRange;
                                    var gasPercent = 1 - electricPercent;

                                    var electricMiles = annualMileage * electricPercent;
                                    var gasMiles = annualMileage * gasPercent;

                                    var mpgeCombined = parseFloat(card.querySelector('.mpgeCombinedElectric')?.value || 0);
                                    var mpgCombined = parseFloat(card.querySelector('.mpgCombinedGas')?.value || 0);
                                    var l2Rate = parseFloat(card.querySelector('.l2ChargingRate')?.value || 0.1855);
                                    var l3Rate = parseFloat(card.querySelector('.l3ChargingRate')?.value || 0.4555);
                                    var fuelCost = parseFloat(card.querySelector('.fuelCostPerGallon')?.value || 2.65);

                                    var annualCost = 0;

                                    if (mpgeCombined > 0) {
                                      var kWhPer100Mi = 23.7 / mpgeCombined * 100;
                                      annualCost += (electricMiles / 100) * kWhPer100Mi * l2Rate;
                                      annualCost += (electricMiles / 100) * kWhPer100Mi * l3Rate;
                                    }

                                    if (mpgCombined > 0) {
                                      annualCost += (gasMiles / mpgCombined) * fuelCost;
                                    }

                                    setFieldValue(card, '.annualEnergyCostMixed', Math.round(annualCost));
                                  }
                                }

function generateLeaseSchedule(capCost, residualValue, moneyFactor, termMonths, firstPaymentDate = new Date()) {
    const schedule = [];
    const depreciation = capCost - residualValue;
    const monthlyDepreciation = depreciation / termMonths;
    const monthlyRentCharge = (capCost + residualValue) * moneyFactor;
    const monthlyPayment = monthlyDepreciation + monthlyRentCharge;
    
    let currentDate = new Date(firstPaymentDate);
    let accumulatedDep = 0;
    
    for (let month = 1; month <= termMonths; month++) {
        accumulatedDep += monthlyDepreciation;
        
        schedule.push({
            month,
            date: new Date(currentDate),
            payment: monthlyPayment,
            depreciation: monthlyDepreciation,
            rentCharge: monthlyRentCharge,
            accumulatedDepreciation: accumulatedDep,
            bookValue: capCost - accumulatedDep,
            residualValue: residualValue
        });
        
        currentDate.setMonth(currentDate.getMonth() + 1);
    }
    
    return schedule;
}

function generateBalloonSchedule(principal, balloonAmount, apr, termMonths, firstPaymentDate = new Date()) {
    const schedule = [];
    const monthlyRate = apr / 100 / 12;
    
    const financedAmount = principal - balloonAmount;
    const monthlyPayment = financedAmount * (monthlyRate * Math.pow(1 + monthlyRate, termMonths)) / 
                          (Math.pow(1 + monthlyRate, termMonths) - 1);
    
    let balance = principal;
    let currentDate = new Date(firstPaymentDate);
    
    for (let month = 1; month <= termMonths; month++) {
        const interestPayment = balance * monthlyRate;
        const principalPayment = monthlyPayment - interestPayment;
        balance -= principalPayment;
        
        const isFinalPayment = month === termMonths;
        const actualPayment = isFinalPayment ? monthlyPayment + balloonAmount : monthlyPayment;
        
        schedule.push({
            month,
            date: new Date(currentDate),
            payment: actualPayment,
            regularPayment: monthlyPayment,
            balloonPayment: isFinalPayment ? balloonAmount : 0,
            principal: principalPayment,
            interest: interestPayment,
            balance: Math.max(0, balance),
        });
        
        currentDate.setMonth(currentDate.getMonth() + 1);
    }
    
    return schedule;
}

function calculateBalloonRemaining(capCost, residualValue, termMonths, balloonMonthsElapsed) {
                                              var totalDepreciation = capCost - residualValue;

                                              var remainingToBalloon = totalDepreciation - totalDepreciationSoFar;

                                                      const dLat = deg2rad(lat2 - lat1);
                                                      const dLon = deg2rad(lon2 - lon1);
                                                      const a =
                                                        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                                                        Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                                                        Math.sin(dLon / 2) * Math.sin(dLon / 2);
                                                      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                                                      return R * c;
                                                    }

function validateGoldenRule(monthlyPayment, msrp) {
    if (!msrp || msrp <= 0) {
        return {
            valid: false,
            percentage: null,
            passed: false,
            message: 'MSRP required for golden rule validation',
            status: 'error'
        };
    }
    
    const percentage = (monthlyPayment / msrp) * 100;
    const passed = percentage <= GOLDEN_RULE_THRESHOLD;
    
    return {
        valid: true,
        percentage: percentage,
        passed: passed,
        threshold: GOLDEN_RULE_THRESHOLD,
        difference: percentage - GOLDEN_RULE_THRESHOLD,
        monthlyPayment: monthlyPayment,
        msrp: msrp,
        status: passed ? 'pass' : 'fail',
        message: passed 
            ? `✓ Golden Rule PASS: ${percentage.toFixed(2)}% ≤ ${GOLDEN_RULE_THRESHOLD}%`
            : `✗ Golden Rule FAIL: ${percentage.toFixed(2)}% > ${GOLDEN_RULE_THRESHOLD}%`,
        recommendation: passed 
            ? null 
            : calculateGoldenRuleTarget(msrp)
    };
}

function calculateGoldenRuleTarget(msrp) {
    const targetPayment = (msrp * GOLDEN_RULE_THRESHOLD) / 100;
    
    return {
        targetPayment: targetPayment,
        message: `To meet golden rule, payment should be ≤ $${fmt(targetPayment)}/month`
    };
}

function suggestGoldenRuleAdjustments(vehicleData) {
    const currentPayment = vehicleData.monthlyPayment;
    const msrp = vehicleData.msrp;
    const targetPayment = (msrp * GOLDEN_RULE_THRESHOLD) / 100;
    const reductionNeeded = currentPayment - targetPayment;
    
    if (reductionNeeded <= 0) {
        return { needed: false };
    }
    
    const suggestions = [];
    
    const term = vehicleData.term || 36;
    const residualPct = vehicleData.residualPct || 50;
    const moneyFactor = vehicleData.moneyFactor || 0.00150;
    
    const depreciationPortion = (100 - residualPct) / 100;
    const monthlyDepreciation = reductionNeeded / (1 + (2 * moneyFactor * term));
    const sellingPriceReduction = (monthlyDepreciation * term) / depreciationPortion;
    
    suggestions.push({
        type: 'selling_price',
        description: 'Negotiate lower selling price',
        amount: sellingPriceReduction,
        impact: `Reduce selling price by ~$${fmt(sellingPriceReduction)}`,
        newTarget: vehicleData.sellingPrice - sellingPriceReduction
    });
    
    const downPaymentIncrease = reductionNeeded * term;
    suggestions.push({
        type: 'down_payment',
        description: 'Increase down payment',
        amount: downPaymentIncrease,
        impact: `Add $${fmt(downPaymentIncrease)} to down payment`,
        newTarget: vehicleData.downPayment + downPaymentIncrease
    });
    
    const currentMF = vehicleData.moneyFactor || 0.00150;
    const targetMFReduction = reductionNeeded / ((vehicleData.sellingPrice + (vehicleData.sellingPrice * residualPct / 100)));
    const targetMF = Math.max(0.00001, currentMF - targetMFReduction);
    
    suggestions.push({
        type: 'money_factor',
        description: 'Negotiate better money factor',
        amount: targetMF,
        impact: `Reduce MF from ${currentMF.toFixed(5)} to ${targetMF.toFixed(5)}`,
        newTarget: targetMF
    });
    
    const longerTerm = term + 3;
    const newMonthlyAtLongerTerm = currentPayment * (term / longerTerm) * 1.02;
    if (newMonthlyAtLongerTerm <= targetPayment) {
        suggestions.push({
            type: 'term',
            description: 'Extend lease term',
            amount: longerTerm,
            impact: `Extend from ${term} to ${longerTerm} months`,
            newTarget: longerTerm,
            estimatedPayment: newMonthlyAtLongerTerm
        });
    }
    
    suggestions.push({
        type: 'incentives',
        description: 'Apply additional incentives/rebates',
        amount: downPaymentIncrease * 0.7,
        impact: `Find $${fmt(downPaymentIncrease * 0.7)} in manufacturer incentives`,
        newTarget: downPaymentIncrease * 0.7
    });
    
    return {
        needed: true,
        reductionNeeded: reductionNeeded,
        targetPayment: targetPayment,
        currentPayment: currentPayment,
        suggestions: suggestions
    };
}

    const card = button.closest('.vehicle-card');
    const vehicleIndex = Array.from(card.parentElement.children).indexOf(card);
    const vehicle = vehicles[vehicleIndex];
    
    if (!vehicle || !vehicle.results) {
        showToast('Calculate vehicle first', 'error');
        return;
    }
    
    const adjustments = suggestGoldenRuleAdjustments(vehicle.results);
    
    if (!adjustments.needed) {
        showToast('Vehicle already meets golden rule!', 'success');
        return;

function applyGoldenRuleSuggestion(vehicleIndex, type, newValue) {
    const card = document.querySelectorAll('.vehicle-card')[vehicleIndex];
    if (!card) return;
    
    switch(type) {
        case 'selling_price':
            setFieldValue(card, '.sellingPrice', newValue);
            break;
        case 'down_payment':
            setFieldValue(card, '.downPayment', newValue);
            break;
        case 'money_factor':
            setFieldValue(card, '.moneyFactor', newValue);
            break;
        case 'term':
            setFieldValue(card, '.term', newValue);
            break;
        case 'incentives':
            showToast(`Find $${fmt(newValue)} in incentives/rebates to add`, 'info');
            break;
    }
    
    document.querySelector('.golden-rule-modal')?.remove();
    
    calculateVehicle(vehicleIndex);
    
    showToast(`Adjustment applied. Recalculating...`, 'success');
}

                                              var vehicleIndex = card.dataset.vehicleIndex;

function buildAllScenariosForCard(card, vehicleIndex = 1) {
                                              var capCost = getNum(card.querySelector('.capAmount'));
                                              var residual = getNum(card.querySelector('.residualValue'));
                                              var sellingPrice = getNum(card.querySelector('.sellingPrice'));
                                              var leaseTerm = parseInt(card.querySelector('.leaseTerm').value);
                                              var apr = getNum(card.querySelector('.apr')) / 100;
                                              var mf = getNum(card.querySelector('.moneyFactor'));
                                              var annualMiles = parseInt(card.querySelector('.annualMileage').value);
                                              var downPayment = getNum(card.querySelector('.downPayment'));
                                              var taxRate = getNum(card.querySelector('.taxRate')) / 100;
                                              var totalFees = getNum(card.querySelector('.totalFees')) || 0;

                                              var make = card.querySelector('.make')?.value || 'Vehicle';
                                              var model = card.querySelector('.model')?.value || '';
                                              var year = card.querySelector('.year')?.value || '';

                                              var vehicleLabel = `${year} ${make} ${model}`.trim();
                                              var totalMiles = annualMiles * (leaseTerm / 12);
                                              var taxPerMonth = (capCost / leaseTerm) * taxRate;

                                              var scenarios = [];

                                              var leaseSchedule = generateLeaseSchedule(capCost, residual, leaseTerm, mf, taxPerMonth);
                                              var leaseMonthly = leaseSchedule[0]?.payment || 0;
                                              var leaseTotal = leaseSchedule.reduce((sum, row) => sum + row.payment, 0) + downPayment + totalFees;
                                              scenarios.push({
                                                id: `v${vehicleIndex}_lease`,
                                                label: `${vehicleLabel} – Lease (${leaseTerm}mo/${annualMiles}k)`,
                                                scenario: 'lease',
                                                termMonths: leaseTerm,
                                                metrics: {
                                                  monthly: leaseMonthly,
                                                  totalCost: leaseTotal,
                                                  costPerMile: totalMiles > 0 ? leaseTotal / totalMiles : 0,
                                                  dueAtSigning: downPayment
                                                },
                                                schedule: leaseSchedule
                                              });

                                              var financeSchedule = generateAmortizationSchedule(sellingPrice - downPayment, leaseTerm, apr, 0);
                                              var financeMonthly = financeSchedule[0]?.payment || 0;
                                              var financeTotal = financeSchedule.reduce((sum, row) => sum + row.payment, 0) + downPayment + (sellingPrice * taxRate) + totalFees;
                                              scenarios.push({
                                                id: `v${vehicleIndex}_finance`,
                                                label: `${vehicleLabel} – Finance (${leaseTerm}mo)`,
                                                scenario: 'finance',
                                                termMonths: leaseTerm,
                                                metrics: {
                                                  monthly: financeMonthly,
                                                  totalCost: financeTotal,
                                                  costPerMile: totalMiles > 0 ? financeTotal / totalMiles : 0,
                                                  dueAtSigning: downPayment
                                                },
                                                schedule: financeSchedule
                                              });

                                              var buyoutTerm = 24;
                                              var buyoutSchedule = generateAmortizationSchedule(residual, buyoutTerm, apr * 0.95, 0);
                                              var leaseAndBuyMonthly = (leaseTotal + buyoutSchedule.reduce((sum, row) => sum + row.payment, 0)) / (leaseTerm + buyoutTerm);
                                              var leaseAndBuyTotal = leaseTotal + buyoutSchedule.reduce((sum, row) => sum + row.payment, 0);
                                              var leaseAndBuyMiles = annualMiles * ((leaseTerm + buyoutTerm) / 12);
                                              scenarios.push({
                                                id: `v${vehicleIndex}_lease_buy`,
                                                label: `${vehicleLabel} – Lease + Buy (${leaseTerm}mo + ${buyoutTerm}mo)`,
                                                scenario: 'lease_buy',
                                                termMonths: leaseTerm + buyoutTerm,
                                                metrics: {
                                                  monthly: leaseAndBuyMonthly,
                                                  totalCost: leaseAndBuyTotal,
                                                  costPerMile: leaseAndBuyMiles > 0 ? leaseAndBuyTotal / leaseAndBuyMiles : 0,
                                                  dueAtSigning: downPayment,
                                                  residualBuyout: residual
                                                },
                                                schedule: [...leaseSchedule, ...buyoutSchedule]
                                              });

                                              var balloonDepreciation = (capCost - residual) * 0.5;
                                              var balloonLeaseMonthly = (balloonDepreciation / leaseTerm) + (capCost + residual) * mf + taxPerMonth;
                                              var balloonLeaseTotal = (balloonLeaseMonthly * leaseTerm) + balloonDepreciation + downPayment + totalFees;
                                              scenarios.push({
                                                id: `v${vehicleIndex}_balloon_lease`,
                                                label: `${vehicleLabel} – Balloon Lease (${leaseTerm}mo, 50% deferred)`,
                                                scenario: 'balloon_lease',
                                                termMonths: leaseTerm,
                                                metrics: {
                                                  monthly: balloonLeaseMonthly,
                                                  totalCost: balloonLeaseTotal,
                                                  costPerMile: totalMiles > 0 ? balloonLeaseTotal / totalMiles : 0,
                                                  dueAtSigning: downPayment,
                                                  balloonDue: balloonDepreciation
                                                }
                                              });

                                              var balloonAmount = residual;
                                              var balloonFinanceSchedule = generateAmortizationSchedule(sellingPrice - downPayment, leaseTerm, apr, balloonAmount);
                                              var balloonFinanceMonthly = balloonFinanceSchedule[0]?.payment || 0;
                                              var balloonFinanceTotal = balloonFinanceSchedule.reduce((sum, row) => sum + row.payment, 0) + downPayment + (sellingPrice * taxRate) + totalFees;
                                              scenarios.push({
                                                id: `v${vehicleIndex}_balloon_finance`,
                                                label: `${vehicleLabel} – Balloon Finance (${leaseTerm}mo)`,
                                                scenario: 'balloon_finance',
                                                termMonths: leaseTerm,
                                                metrics: {
                                                  monthly: balloonFinanceMonthly,
                                                  totalCost: balloonFinanceTotal,
                                                  costPerMile: totalMiles > 0 ? balloonFinanceTotal / totalMiles : 0,
                                                  dueAtSigning: downPayment,
                                                  balloonDue: balloonAmount
                                                },
                                                schedule: balloonFinanceSchedule
                                              });

                                              scenarios.push({
                                                id: `v${vehicleIndex}_single_pay`,
                                                label: `${vehicleLabel} – Single Pay Lease (${leaseTerm}mo)`,
                                                scenario: 'single_pay',
                                                termMonths: leaseTerm,
                                                metrics: {
                                                  monthly: leaseTotal / leaseTerm,
                                                  totalCost: leaseTotal,
                                                  costPerMile: totalMiles > 0 ? leaseTotal / totalMiles : 0,
                                                  dueAtSigning: leaseTotal
                                                }
                                              });

                                              var subMf = mf * 0.70;
                                              var subLeaseSchedule = generateLeaseSchedule(capCost, residual, leaseTerm, subMf, taxPerMonth);
                                              var subLeaseMonthly = subLeaseSchedule[0]?.payment || 0;
                                              var subLeaseTotal = subLeaseSchedule.reduce((sum, row) => sum + row.payment, 0) + downPayment + totalFees;

                                              scenarios.push({
                                                id: `v${vehicleIndex}_subvented`,
                                                label: `${vehicleLabel} – Subvented Lease (${leaseTerm}mo)`,
                                                scenario: 'subvented',
                                                termMonths: leaseTerm,
                                                metrics: {
                                                  monthly: subLeaseMonthly,
                                                  totalCost: subLeaseTotal,
                                                  costPerMile: totalMiles > 0 ? subLeaseTotal / totalMiles : 0,
                                                  dueAtSigning: downPayment
                                                },
                                                schedule: subLeaseSchedule
                                              });

                                              var subLeaseAndBuyTotal = subLeaseTotal + buyoutSchedule.reduce((sum, row) => sum + row.payment, 0);
                                              var subLeaseAndBuyMonthly = subLeaseAndBuyTotal / (leaseTerm + buyoutTerm);
                                              scenarios.push({
                                                id: `v${vehicleIndex}_subvented_buy`,
                                                label: `${vehicleLabel} – Subvented + Buy (${leaseTerm}mo + ${buyoutTerm}mo)`,
                                                scenario: 'subvented_buy',
                                                termMonths: leaseTerm + buyoutTerm,
                                                metrics: {
                                                  monthly: subLeaseAndBuyMonthly,
                                                  totalCost: subLeaseAndBuyTotal,
                                                  costPerMile: leaseAndBuyMiles > 0 ? subLeaseAndBuyTotal / leaseAndBuyMiles : 0,
                                                  dueAtSigning: downPayment,
                                                  residualBuyout: residual
                                                }
                                              });

                                              scenarios.push({
                                                id: `v${vehicleIndex}_subvented_single`,
                                                label: `${vehicleLabel} – Subvented Single Pay (${leaseTerm}mo)`,
                                                scenario: 'subvented_single',
                                                termMonths: leaseTerm,
                                                metrics: {
                                                  monthly: subLeaseTotal / leaseTerm,
                                                  totalCost: subLeaseTotal,
                                                  costPerMile: totalMiles > 0 ? subLeaseTotal / totalMiles : 0,
                                                  dueAtSigning: subLeaseTotal
                                                }
                                              });

                                              scenarios.push({
                                                id: `v${vehicleIndex}_balloon_lease_buy`,
                                                label: `${vehicleLabel} – Balloon Lease + Buy (${leaseTerm}mo + ${buyoutTerm}mo)`,
                                                scenario: 'balloon_lease_buy',
                                                termMonths: leaseTerm + buyoutTerm,
                                                metrics: {
                                                  monthly: (balloonLeaseTotal + buyoutSchedule.reduce((sum, row) => sum + row.payment, 0)) / (leaseTerm + buyoutTerm),
                                                  totalCost: balloonLeaseTotal + buyoutSchedule.reduce((sum, row) => sum + row.payment, 0),
                                                  costPerMile: leaseAndBuyMiles > 0 ? (balloonLeaseTotal + buyoutSchedule.reduce((sum, row) => sum + row.payment, 0)) / leaseAndBuyMiles : 0,
                                                  dueAtSigning: downPayment
                                                }
                                              });

                                              scenarios.push({
                                                id: `v${vehicleIndex}_finance_short`,
                                                label: `${vehicleLabel} – Finance Short Term (24mo)`,
                                                scenario: 'finance_short',
                                                termMonths: 24,
                                                metrics: {
                                                  monthly: (sellingPrice - downPayment) / 24,
                                                  totalCost: sellingPrice + (sellingPrice * taxRate) + totalFees,
                                                  costPerMile: ((annualMiles * 2) > 0) ? (sellingPrice + (sellingPrice * taxRate) + totalFees) / (annualMiles * 2) : 0,
                                                  dueAtSigning: downPayment
                                                }
                                              });

                                              scenarios.push({
                                                id: `v${vehicleIndex}_lease_extended`,
                                                label: `${vehicleLabel} – Extended Lease (66mo)`,
                                                scenario: 'lease_extended',
                                                termMonths: 66,
                                                metrics: {
                                                  monthly: leaseMonthly * 0.85,
                                                  totalCost: (leaseMonthly * 0.85 * 66) + downPayment + totalFees,
                                                  costPerMile: ((annualMiles * 4) > 0) ? ((leaseMonthly * 0.85 * 66) + downPayment + totalFees) / (annualMiles * 4) : 0,
                                                  dueAtSigning: downPayment
                                                }
                                              });

                                              return scenarios;
                                            }

async function loadScenarios() {
    try {
        const response = await fetch('/mnt/user-data/uploads/scenariolist.json')
            .catch(() => fetch('./scenariolist.json'))
            .catch(() => fetch('./data/scenariolist.json'));
        
        if (response.ok) {
            SCENARIOS_LIST = await response.json();
            console.log(`✓ Loaded ${SCENARIOS_LIST.length} scenarios from JSON`);
        } else {
            throw new Error('Failed to load scenariolist.json');
        }
    } catch (error) {
        console.warn('Could not load scenariolist.json, using embedded scenarios:', error);
        SCENARIOS_LIST = EMBEDDED_SCENARIOS;
    }
    
    populateAllScenarioSelectors();
    
    return SCENARIOS_LIST;
}

function populateAllScenarioSelectors() {
    const selectors = document.querySelectorAll('.scenarioSelect');
    
    selectors.forEach(selector => {
        populateScenarioSelector(selector);
    });
    
    console.log(`✓ Populated ${selectors.length} scenario selectors`);
}

function populateScenarioSelector(selector) {
    if (!selector) return;
    
    while (selector.options.length > 1) {
        selector.remove(1);
    }
    
    const categorized = {};
    SCENARIOS_LIST.forEach(scenario => {
        const category = scenario.category || 'Other';
        if (!categorized[category]) {
            categorized[category] = [];
        }
        categorized[category].push(scenario);
    });
    
    Object.keys(categorized).sort().forEach(category => {
        const optgroup = document.createElement('optgroup');
        optgroup.label = category;
        
        categorized[category].forEach(scenario => {
            const option = document.createElement('option');
            option.value = scenario.id;
            option.textContent = `${scenario.id}. ${scenario.title}`;
            option.dataset.scenarioData = JSON.stringify(scenario);
            optgroup.appendChild(option);
        });
        
        selector.appendChild(optgroup);
    });
    
    selector.addEventListener('change', handleScenarioSelection);
}

function handleScenarioSelection(event) {
    const selector = event.target;
    const card = selector.closest('.vehicle-card');
    
    if (!card) return;
    
    const selectedOption = selector.options[selector.selectedIndex];
    
    if (!selectedOption || !selectedOption.value) {
        const detailsDiv = card.querySelector('.scenario-details');
        if (detailsDiv) {
            detailsDiv.classList.add('hidden');
        }
        return;
    }
    
    const scenarioData = JSON.parse(selectedOption.dataset.scenarioData || '{}');
    
    displayScenarioDetails(card, scenarioData);
}

function displayScenarioDetails(card, scenario) {
    const detailsDiv = card.querySelector('.scenario-details');
    const infoDiv = card.querySelector('.scenario-info');
    
    if (!detailsDiv || !infoDiv) return;
    
    detailsDiv.classList.remove('hidden');
    
    infoDiv.innerHTML = `
        <div class="scenario-detail-content">
            <div class="scenario-header">
                <span class="scenario-id">Scenario #${scenario.id}</span>
                <span class="scenario-category">${scenario.category}</span>

function generateScenarioAnalysis(scenario, vehicle) {
    if (!vehicle || !vehicle.results) {
        return {
            html: '<p style="color: #ef4444;">Please calculate vehicle first before applying scenario.</p>'
        };
    }
    
    const baseResults = vehicle.results;
    
    let html = `
        <div class="scenario-results-grid">
            <div class="result-section">
                <h6>Base Vehicle Analysis</h6>
                <div class="result-row">
                    <span>Deal Type:</span>
                    <strong>${baseResults.dealType || 'N/A'}</strong>
                </div>
                <div class="result-row">
                    <span>Monthly Payment:</span>
                    <strong>$${fmt(baseResults.monthlyPayment || 0)}</strong>
                </div>
                <div class="result-row">
                    <span>Total Cost (${baseResults.term}mo):</span>
                    <strong>$${fmt((baseResults.monthlyPayment || 0) * (baseResults.term || 36))}</strong>
                </div>
            </div>
            
            <div class="result-section">
                <h6>Scenario-Specific Insights</h6>
    `;
    
    if (scenario.tags.includes('gig') || scenario.tags.includes('business')) {
        const annualMiles = vehicle.annualMileage || 12000;
        const monthlyMiles = annualMiles / 12;
        const costPerMile = baseResults.monthlyPayment / monthlyMiles;
        
        html += `

        html += `

}

function generateRecommendations(scenario, vehicle) {
    const recommendations = [];
    
    if (scenario.tags.includes('business') || scenario.tags.includes('fleet')) {
        recommendations.push('Consider Section 179 deduction if purchasing for business use');
        recommendations.push('Consult tax professional for optimal expense vs. mileage deduction');
        if (vehicle.results.dealType === 'lease') {
            recommendations.push('Lease payments are typically 100% deductible for business use');
        }
    }
    
    if (scenario.tags.includes('gig')) {
        recommendations.push('Track all mileage meticulously for tax purposes');
        recommendations.push('Consider commercial insurance or rideshare endorsement');
        recommendations.push('Factor in accelerated depreciation from high mileage');
    }
    
    if (scenario.tags.includes('ev') || scenario.category === 'Electric Vehicle') {
        recommendations.push('Verify home charging installation costs and capabilities');
        recommendations.push('Research public charging availability in your area');
        recommendations.push('Consider time-of-use electricity rates for optimal savings');
    }
    
    if (scenario.tags.includes('climate')) {

        recommendations.push('Compare this scenario with others to find optimal strategy');

    return recommendations;
}

function exportScenarioResults(vehicleIndex, scenarioId) {
    const vehicle = vehicles[vehicleIndex];
    const scenario = SCENARIOS_LIST.find(s => s.id === scenarioId);
    
    if (!vehicle || !scenario) {
        showToast('Error exporting scenario results', 'error');
        return;
    }
    
    const exportData = {
        scenario: scenario,
        vehicle: {
            year: vehicle.year,
            make: vehicle.make,
            model: vehicle.model,
            trim: vehicle.trim
        },
        results: vehicle.results,
        analysis: generateScenarioAnalysis(scenario, vehicle),
        exportedAt: new Date().toISOString()
    };
    
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `scenario_${scenarioId}_vehicle_${vehicleIndex + 1}_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    
    showToast('Scenario results exported!', 'success');
}

function analyzeTradeOptimization() {
    if (vehicles.length < 2) {
        return {
            valid: false,
            message: 'Need at least 2 vehicles to compare trade optimization'
        };
    }
    
    const validVehicles = vehicles
        .map((v, idx) => ({ ...v, index: idx }))
        .filter(v => v.results && v.results.dealType === 'lease');
    
    if (validVehicles.length < 2) {
        return {
            valid: false,
            message: 'Need at least 2 calculated lease vehicles for trade optimization'
        };
    }
    
    const tradeEquity = validVehicles[0].tradein - validVehicles[0].tradePayoff;
    
    if (tradeEquity <= 0) {
        return {
            valid: false,
            message: 'No positive trade equity available to optimize',
            tradeEquity: tradeEquity
        };
    }
    
    const scenarios = validVehicles.map(vehicle => {
        return analyzeTradeEquityScenarios(vehicle, tradeEquity, validVehicles);
    });
    
    const optimalStrategy = findOptimalTradeDistribution(scenarios, tradeEquity);
    
    return {
        valid: true,
        tradeEquity: tradeEquity,
        scenarios: scenarios,
        optimalStrategy: optimalStrategy,
        recommendation: generateTradeRecommendation(optimalStrategy)
    };
}

function analyzeTradeEquityScenarios(vehicle, totalTradeEquity, allVehicles) {
    const basePayment = vehicle.results.monthlyPayment;
    const baseCapCost = vehicle.results.netCapCost;
    const msrp = vehicle.msrp || vehicle.results.msrp;
    
    const fullTradeScenario = calculateTradeImpact(vehicle, totalTradeEquity);
    
    const partialTradeScenario = calculateTradeImpact(vehicle, totalTradeEquity / 2);
    
    const noTradeScenario = {
        appliedEquity: 0,
        newPayment: basePayment,
        paymentReduction: 0,
        newCapCost: baseCapCost,
        percentageReduction: 0,
        goldenRuleImpact: validateGoldenRule(basePayment, msrp)
    };
    
    const valueScore = calculateTradeValueScore(vehicle, fullTradeScenario);
    
    return {
        vehicleIndex: vehicle.index,
        vehicleName: `${vehicle.year} ${vehicle.make} ${vehicle.model}`,
        basePayment: basePayment,
        msrp: msrp,
        scenarios: {
            full: fullTradeScenario,
            partial: partialTradeScenario,
            none: noTradeScenario
        },
        valueScore: valueScore,
        tradeEfficiency: fullTradeScenario.paymentReduction / totalTradeEquity,
        goldenRuleStatus: noTradeScenario.goldenRuleImpact.passed ? 'pass' : 'fail'
    };
}

function calculateTradeImpact(vehicle, tradeEquity) {
    const results = vehicle.results;
    const term = results.term || 36;
    const moneyFactor = results.moneyFactor || 0.00150;
    const residualValue = results.residualValue;
    const msrp = vehicle.msrp || results.msrp;
    
    const newCapCost = results.netCapCost - tradeEquity;
    
    const newDepreciation = newCapCost - residualValue;
    const newMonthlyDep = newDepreciation / term;
    
    const newRentCharge = (newCapCost + residualValue) * moneyFactor;
    
    const newMonthlyPayment = newMonthlyDep + newRentCharge;
    
    const paymentReduction = results.monthlyPayment - newMonthlyPayment;
    const percentageReduction = (paymentReduction / results.monthlyPayment) * 100;
    
    const goldenRuleImpact = validateGoldenRule(newMonthlyPayment, msrp);
    
    const totalSavings = paymentReduction * term;
    
    return {
        appliedEquity: tradeEquity,
        newCapCost: newCapCost,
        newMonthlyPayment: newMonthlyPayment,
        paymentReduction: paymentReduction,
        percentageReduction: percentageReduction,
        totalSavings: totalSavings,
        goldenRuleImpact: goldenRuleImpact,
        goldenRuleImprovement: goldenRuleImpact.passed && !validateGoldenRule(results.monthlyPayment, msrp).passed,
        effectiveDiscount: (tradeEquity / newMonthlyPayment).toFixed(1) + ' months free'
    };
}

function calculateTradeValueScore(vehicle, scenario) {
    let score = 0;
    
    const efficiencyScore = Math.min(30, (scenario.paymentReduction / scenario.appliedEquity) * 10000);
    score += efficiencyScore;
    
    if (scenario.goldenRuleImprovement) {
        score += 25;
    } else if (scenario.goldenRuleImpact.passed) {
        score += 15;
    } else {
        const improvement = scenario.goldenRuleImpact.percentage < validateGoldenRule(vehicle.results.monthlyPayment, vehicle.msrp).percentage;
        score += improvement ? 10 : 0;
    }
    
    const pctScore = Math.min(25, scenario.percentageReduction);
    score += pctScore;
    
    const msrp = vehicle.msrp || vehicle.results.msrp;
    if (msrp > 60000) {
        score += 20;
    } else if (msrp > 40000) {
        score += 15;
    } else {
        score += 10;
    }
    
    return Math.min(100, score);
}

function findOptimalTradeDistribution(scenarios, totalTradeEquity) {
    const ranked = [...scenarios].sort((a, b) => b.valueScore - a.valueScore);
    
    const allToTop = {
        type: 'single',
        primary: ranked[0].vehicleIndex,
        allocation: {
            [ranked[0].vehicleIndex]: totalTradeEquity
        },
        totalSavings: ranked[0].scenarios.full.totalSavings,
        description: `Apply all $${fmt(totalTradeEquity)} to ${ranked[0].vehicleName}`
    };
    
    if (scenarios.length >= 2) {
        const split1 = totalTradeEquity * 0.7;
        const split2 = totalTradeEquity * 0.3;
        
        const impact1 = calculateTradeImpact(vehicles[ranked[0].vehicleIndex], split1);
        const impact2 = calculateTradeImpact(vehicles[ranked[1].vehicleIndex], split2);
        
        const splitStrategy = {
            type: 'split',
            allocation: {
                [ranked[0].vehicleIndex]: split1,
                [ranked[1].vehicleIndex]: split2
            },
            totalSavings: impact1.totalSavings + impact2.totalSavings,
            description: `Apply $${fmt(split1)} to ${ranked[0].vehicleName} and $${fmt(split2)} to ${ranked[1].vehicleName}`
        };
        
        const goldenRuleFailures = scenarios.filter(s => s.goldenRuleStatus === 'fail');
        let goldenRuleStrategy = null;
        
        if (goldenRuleFailures.length > 0) {
            const fixStrategies = goldenRuleFailures.map(failure => {
                const vehicle = vehicles[failure.vehicleIndex];
                const currentPayment = failure.basePayment;
                const targetPayment = (failure.msrp * 1.5) / 100;
                const reductionNeeded = currentPayment - targetPayment;
                
                const term = vehicle.results.term || 36;
                const moneyFactor = vehicle.results.moneyFactor || 0.00150;
                const residualPct = vehicle.results.residualPct || 50;
                
                const equityNeeded = (reductionNeeded * term) / (1 - (residualPct/100));
                
                return {
                    vehicleIndex: failure.vehicleIndex,
                    vehicleName: failure.vehicleName,
                    equityNeeded: Math.min(equityNeeded, totalTradeEquity),
                    currentPayment: currentPayment,
                    targetPayment: targetPayment
                };
            });
            
            fixStrategies.sort((a, b) => a.equityNeeded - b.equityNeeded);
            
            let remainingEquity = totalTradeEquity;
            const allocation = {};
            let fixedCount = 0;
            
            for (const fix of fixStrategies) {
                if (remainingEquity >= fix.equityNeeded) {
                    allocation[fix.vehicleIndex] = fix.equityNeeded;
                    remainingEquity -= fix.equityNeeded;
                    fixedCount++;
                } else if (remainingEquity > 0) {
                    allocation[fix.vehicleIndex] = remainingEquity;
                    remainingEquity = 0;
                }
            }
            
            goldenRuleStrategy = {
                type: 'golden_rule_focus',
                allocation: allocation,
                fixedCount: fixedCount,
                description: `Focus on achieving golden rule - fixes ${fixedCount} vehicle(s)`,
                details: fixStrategies.map(f => ({
                    vehicle: f.vehicleName,
                    needed: f.equityNeeded,
                    allocated: allocation[f.vehicleIndex] || 0
                }))
            };
        }
        
        const strategies = [allToTop, splitStrategy];
        if (goldenRuleStrategy) {
            strategies.push(goldenRuleStrategy);
        }
        
        const scoredStrategies = strategies.map(strategy => {
            let score = 0;
            
            score += (strategy.totalSavings || 0) / 100;
            
            if (strategy.type === 'golden_rule_focus') {
                score += strategy.fixedCount * 1000;
            }
            
            if (strategy.type === 'single') {
                score += 100;
            }
            
            return { ...strategy, score };
        });
        
        scoredStrategies.sort((a, b) => b.score - a.score);
        
        return {
            recommended: scoredStrategies[0],
            alternatives: scoredStrategies.slice(1),
            allStrategies: scoredStrategies
        };
    }
    
    return {
        recommended: allToTop,
        alternatives: [],
        allStrategies: [allToTop]
    };
}

function generateTradeRecommendation(strategy) {
    const recommended = strategy.recommended;
    
    let title, explanation, steps;
    
    if (recommended.type === 'single') {
        title = '🎯 Recommended: Apply All Trade to One Vehicle';
        explanation = `The highest value is achieved by applying your entire trade equity to one vehicle. This provides the maximum payment reduction and simplifies the transaction.`;
        steps = [
            `Apply $${fmt(Object.values(recommended.allocation)[0])} trade equity to Vehicle #${Object.keys(recommended.allocation)[0] - (-1)}`,
            'Complete transaction for this vehicle with reduced cap cost',
            'Lease other vehicle(s) without trade application'
        ];
    } else if (recommended.type === 'split') {
        title = '⚖️ Recommended: Split Trade Equity';
        explanation = `Distributing your trade equity provides balanced savings across multiple vehicles.`;
        steps = Object.entries(recommended.allocation).map(([idx, amount]) => 
            `Apply $${fmt(amount)} to Vehicle #${parseInt(idx) + 1}`
        );
    } else if (recommended.type === 'golden_rule_focus') {
        title = '🏆 Recommended: Focus on Golden Rule';
        explanation = `Prioritize achieving the 1.5% golden rule for maximum value. This strategy fixes ${recommended.fixedCount} vehicle(s) that are currently failing.`;
        steps = recommended.details.map(detail => 
            `${detail.vehicle}: Apply $${fmt(detail.allocated)} (${detail.allocated >= detail.needed ? 'ACHIEVES' : 'IMPROVES'} golden rule)`
        );
    }
    
    return {
        title,
        explanation,
        steps,
        estimatedMonthlySavings: recommended.totalSavings ? recommended.totalSavings / 36 : null,
        alternatives: strategy.alternatives.map(alt => ({
            type: alt.type,
            description: alt.description,
            savings: alt.totalSavings
        }))
    };
}

function applyTradeOptimization() {
    const analysis = analyzeTradeOptimization();
    if (!analysis.valid) {
        showToast('Cannot apply trade optimization', 'error');
        return;
    }
    
    const strategy = analysis.optimalStrategy.recommended;
    const allocation = strategy.allocation;
    
    Object.entries(allocation).forEach(([vehicleIndex, amount]) => {
        const idx = parseInt(vehicleIndex);
        const card = document.querySelectorAll('.vehicle-card')[idx];
        
        if (card && vehicles[idx]) {
            const currentDown = vehicles[idx].downPayment || 0;
            setFieldValue(card, '.downPayment', currentDown + amount);
            
            calculateVehicle(idx);
        }
    });
    
    showToast('Trade optimization applied! Vehicles recalculated.', 'success');
}
